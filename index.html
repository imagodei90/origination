<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Work">
<link rel="manifest" href="manifest.json">
<title>Work</title>
<link rel="icon" href="favicon.ico?v=20261115_2039" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20261115_2039">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=20261115_2039">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png?v=20261115_2039">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Workout Dashboard 와 같은 골격. accent 만 teal 로 간다.
   다크가 기본이고 라이트는 html[data-m="light"] 로 명시 전환한다. */
:root{
  --bg:#0a0a0a; --card:#111114; --card2:#18181b;
  --fg:#fafafa; --mut:#71717a; --dim:#52525b; --bd:#1f1f23; --hair:#1a1a1e;
  --acc:#1EA49D; --acc-fg:#0a0a0a;
  --map-bg:#0a0a0a; --map-land:#18181b; --map-bd:#2a2a30; --map-heat:#1EA49D;
  --map-ext:#050507; --map-ink:#fafafa; --map-sub:#71717a;
}
html[data-m="light"]{
  --bg:#fafaf9; --card:#ffffff; --card2:#f4f4f5;
  --fg:#18181b; --mut:#71717a; --dim:#a1a1aa; --bd:#e4e4e7; --hair:#f4f4f5;
  --acc:#0F857E; --acc-fg:#ffffff;
  --map-bg:#0f1113; --map-land:#1c1f22; --map-bd:#2e3238; --map-heat:#1EA49D;
  --map-ext:#08090b; --map-ink:#fafafa; --map-sub:#8b8f95;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;margin:0 auto;max-width:1200px;padding:24px 24px calc(48px + env(safe-area-inset-bottom));
  background:var(--bg);color:var(--fg);min-height:100vh;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",
    "Segoe UI",Roboto,sans-serif;
  font-feature-settings:"cv02","cv03","cv04"}
@media(max-width:768px){body{padding:14px 14px calc(40px + env(safe-area-inset-bottom))}}
@media(max-width:540px){body{padding:12px 12px calc(36px + env(safe-area-inset-bottom))}}
.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace}
h1{font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-0.03em}
@media(max-width:540px){h1{font-size:20px}}
/* subtitle 은 mono 가 아니다 — Workout 은 본문 폰트를 쓴다 */
.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
@media(max-width:540px){.sub{font-size:12px;margin-bottom:12px}}
/* 헤더 — 제목 왼쪽, 탭·토글 오른쪽. 아래 줄에 subtitle */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;
  gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hdr .rgt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 세그먼트 토글 — Workout 의 lang-toggle */
.who{display:inline-flex;gap:0;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.who button{background:transparent;color:var(--mut);border:none;padding:6px 12px;
  font:11px "JetBrains Mono","SF Mono",monospace;letter-spacing:.1em;cursor:pointer;
  transition:all .1s}
.who button:hover{color:var(--fg)}
.who button.on{background:var(--acc);color:var(--acc-fg);font-weight:600}
.kpi{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin:0 0 20px}
@media(max-width:900px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:12px;
  padding:16px;text-align:left}
.kpi b{display:block;font-size:30px;font-weight:500;line-height:1.1;letter-spacing:-.04em;
  font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums}
@media(max-width:540px){.kpi b{font-size:22px}}
.kpi div.hi{border-color:var(--acc)}
.kpi div.hi b{color:var(--acc)}
.kpi em{font-style:normal;display:block;font-size:10.5px;color:var(--dim);margin-top:3px;
  font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace}
.kpi2{grid-template-columns:repeat(4,1fr);margin-top:-8px}
@media(max-width:900px){.kpi2{grid-template-columns:repeat(2,1fr)}}
/* 권역이 넷이 되면 '컨택 누적' 까지 다섯 칸이다. 폰에서는 2열로 접힌다. */
.kpi2.k5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.kpi2.k5{grid-template-columns:repeat(2,1fr)}}
.kpi2 div{padding:12px 16px}
.kpi2 b{font-size:20px}
.kpi i{font-style:normal;display:block;font-size:11px;color:var(--mut);margin-top:4px;
  text-transform:uppercase;letter-spacing:.1em;
  font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace}
.stick{position:sticky;top:0;z-index:30;background:var(--bg);padding:0 0 12px}
.tabs{display:inline-flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:2px;
  max-width:100%;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;padding:6px 10px;border:0;border-radius:6px;
  background:transparent;color:var(--mut);cursor:pointer;white-space:nowrap;
  font:11px "JetBrains Mono","SF Mono",monospace;letter-spacing:.05em;
  text-transform:uppercase}
.tb:hover{color:var(--fg)}
/* 활성 탭은 accent 로 꽉 채우지 않는다 — 안쪽에서 한 겹 떠오르는 정도 */
.tb.on{background:var(--card);color:var(--fg);font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.35)}
html[data-m="light"] .tb.on{box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media(max-width:700px){
  .hdr{gap:10px}
  .hdr .rgt{width:100%;justify-content:flex-start}
  .tabs{width:100%;flex-wrap:wrap;overflow:visible}
  .tb{flex:1 1 auto;text-align:center;padding:8px 6px;letter-spacing:.02em;font-size:10.5px}
  .who{flex:0 0 auto}
}
@media(max-width:400px){
  .tb{font-size:10px;padding:8px 4px}
}
#q{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:6px;
  background:var(--card2);color:var(--fg);font:13px inherit;margin:12px 0 8px}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border:1px solid var(--bd);border-radius:6px;
  background:var(--card2);color:var(--mut);cursor:pointer;white-space:nowrap;
  font:11px "JetBrains Mono","SF Mono",monospace;letter-spacing:.06em}
.chip.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.cnt{font-size:11.5px;color:var(--mut);margin:11px 0 8px;
  font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
.row>summary{padding:10px 11px;cursor:pointer;display:flex;gap:7px;align-items:center;
  list-style:none;flex-wrap:wrap}
.row>summary::-webkit-details-marker{display:none}
.row>summary::before{content:'\25b8';color:var(--dim);font-size:11px}
.row[open]>summary::before{content:'\25be'}
.nm{font-weight:600;font-size:13.5px}
.cd{color:var(--dim);font-size:10.5px;font-variant-numeric:tabular-nums}
.spk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc);
  letter-spacing:-1px;font-size:13px}
.sz{color:var(--mut);font-size:10.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.st{font-size:9.5px;padding:2px 7px;border-radius:9px;font-weight:600}
.st-new,.st-live,.st-watch,.st-seen,.st-drop{background:var(--card2);color:var(--mut);
  border:1px solid var(--bd)}
.st-watch{color:var(--acc);border-color:var(--acc)}
.st-live{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.evn{background:var(--card2);color:var(--acc);font-size:9.5px;padding:2px 7px;
  border-radius:6px;border:1px solid var(--bd)}
.bd{padding:0 11px 11px;border-top:1px solid var(--hair)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:9.5px;padding:2px 7px;border-radius:6px;background:var(--card2);
  color:var(--mut);border:1px solid var(--bd)}
.lbl{font-size:10.5px;color:var(--mut);font-weight:600;margin:13px 0 5px}
.lbl em{font-style:normal;color:var(--dim);font-weight:400}
.unit{font-size:9.5px;color:var(--dim);text-align:right;margin-bottom:3px}
.unit em{font-style:normal}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 지표명 열은 가로 스크롤에도 고정한다. collapse 면 sticky 셀의 테두리가 사라져
   separate + border-spacing:0 을 쓰고, 경계선은 box-shadow 로 그린다. */
table.tt{width:100%;border-collapse:separate;border-spacing:0;font-size:10.5px;
  min-width:420px;font-variant-numeric:tabular-nums}
table.tt th,table.tt td{padding:3px 6px;border-bottom:1px solid var(--hair);
  text-align:right;white-space:nowrap}
table.tt thead th{color:var(--dim);font-weight:600;background:var(--card)}
table.tt tbody th{text-align:left;color:var(--mut);font-weight:500}
table.tt th:first-child{position:sticky;left:0;z-index:2;background:var(--card);
  box-shadow:1px 0 0 var(--hair)}
table.tt thead th:first-child{z-index:3}
/* Cadence */
.cdsec{font-size:9.5px;color:var(--dim);margin:11px 0 4px;letter-spacing:.3px;
  display:flex;align-items:baseline}
.cdsec em{font-style:normal;margin-left:auto}
.cdr{background:var(--card);border:1px solid var(--bd);border-radius:9px;
  padding:8px 10px;margin-bottom:5px;cursor:pointer}
.cdr.op{border-color:var(--acc)}
.pq{width:100%;padding:9px 12px;margin:0 0 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:13px}
.pq:focus{outline:none;border-color:var(--acc)}
.cdr.tk{opacity:.55}
.cdr .ck{display:inline-block;width:15px;height:15px;border:1px solid var(--dim);border-radius:4px;flex:none;position:relative;top:2px}
.cdr .ck.on{background:var(--acc);border-color:var(--acc)}
.cdr1{display:flex;align-items:baseline;gap:6px}
.cdr1 b{font-size:12.5px;font-weight:600}
.cdm{margin-left:auto;font-size:10px;color:var(--mut);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.cdr2{font-size:10px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.bg{font-size:9px;padding:1px 6px;border-radius:4px;font-weight:600;
  background:var(--hair);color:var(--mut)}
/* 강도는 색을 바꾸지 않고 같은 색의 진하기로만 표현한다 (Workout 히트맵 규칙) */
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--acc);
  flex:none;position:relative;top:1px}
.due{font:10px "JetBrains Mono","SF Mono",monospace;letter-spacing:.08em;font-weight:500;
  padding:2px 7px;border-radius:5px;background:var(--acc);color:var(--acc-fg);flex:none}
/* 예정 미팅 */
.up{border-color:var(--acc)}
.pl{display:inline-block;font:9.5px "JetBrains Mono","SF Mono",monospace;letter-spacing:.08em;
  padding:2px 7px;border-radius:5px;border:1px solid var(--bd);color:var(--mut);flex:none}
.pl.n{color:var(--acc);border-color:var(--acc)}
.pl.o{color:#e0796b;border-color:#5a2f2a}
.lg2{border:1px solid var(--bd);border-radius:9px;padding:9px 11px;margin-bottom:6px;
  background:var(--card)}
.lg2 .a{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.lg2 .a button{font:10.5px "JetBrains Mono","SF Mono",monospace;letter-spacing:.06em;
  padding:5px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card2);
  color:var(--mut);cursor:pointer}
.lg2 .a button.p{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.lg2 .a button.d{color:#e0796b;border-color:#5a2f2a}
.swlg{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--dim);
  margin:2px 0 8px;font-family:"JetBrains Mono","SF Mono",monospace}
.swlg i{width:12px;height:12px;border-radius:2px;background:var(--acc);display:inline-block}
.t1{font-size:8.5px;font-weight:700;letter-spacing:.4px;background:var(--acc);
  color:var(--acc-fg);padding:1px 5px;border-radius:4px}
.pb{height:3px;border-radius:2px;background:var(--hair);margin-top:5px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--acc)}
.cdx{margin-top:9px;border-top:1px solid var(--hair);padding-top:8px}
.pp{display:flex;align-items:baseline;gap:6px;font-size:11px;padding:3px 0}
.pp b{font-weight:500}
.hz{font-size:10px;color:var(--mut);padding:2px 0;font-variant-numeric:tabular-nums}
.mglist{max-height:38vh;overflow:auto;margin:0 0 10px;border-top:1px solid var(--hair)}
.mgrow{display:flex;gap:8px;align-items:baseline;padding:8px 4px;border-bottom:1px solid var(--hair);cursor:pointer}
.mgrow:active{background:rgba(30,164,157,.06)}
.mgrow b{font-size:12.5px;font-weight:600;flex:none}
.mgrow .o{font-size:10.5px;color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgrow .n{font:9.5px "JetBrains Mono","SF Mono",monospace;color:var(--dim);flex:none}
/* 조직 / 인물 축 전환 — 필터 칩 위에 선다 */
.seg.cv{width:auto;display:inline-flex;margin:0 0 9px}
.seg.cv div{padding:5px 14px;font:11px "JetBrains Mono","SF Mono",monospace;letter-spacing:.06em}
/* 인물 행의 소속 */
.pog{font-size:10.5px;color:var(--mut)}
.gh{color:var(--dim)}
/* 명함 */
.nc{position:relative;background:var(--card2);border:1px solid var(--bd);border-radius:10px;
  padding:12px 13px 12px 15px;overflow:hidden}
.nc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.nc.dim::before{opacity:.28}
.nch{font-size:14px;font-weight:600;letter-spacing:-.01em}
.nco{font-size:11.5px;color:var(--mut);margin-top:2px}
.ncr{font:10px "JetBrains Mono","SF Mono",monospace;color:var(--dim);letter-spacing:.04em;margin-top:1px}
.ncd{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:10px;
  padding-top:9px;border-top:1px solid var(--hair);font-size:11px}
.ncd dt{font:9.5px "JetBrains Mono","SF Mono",monospace;color:var(--dim);letter-spacing:.06em}
.ncd dd{color:var(--mut);font-variant-numeric:tabular-nums;margin:0}
.ncm{font-size:11px;color:var(--mut);margin-top:9px;padding-top:8px;
  border-top:1px solid var(--hair);line-height:1.6;white-space:pre-wrap}
.nct{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.nct .tg{font:9px "JetBrains Mono","SF Mono",monospace;padding:2px 7px;border-radius:10px;
  border:1px solid var(--bd);color:var(--mut);letter-spacing:.04em}
.ncf{margin-top:10px}
/* 기록 행의 이름 — 장소·메모와 한 문자열에 섞여 있던 것을 떼어낸다.
   accent 를 옅게 깔아 메타데이터와 급을 가른다. 누르면 그 사람 명함으로 간다. */
.rowC{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px}
.nmC{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;
  padding:2px 9px;border-radius:11px;background:rgba(30,164,157,.14);
  color:var(--acc);border:1px solid rgba(30,164,157,.3);cursor:pointer;white-space:nowrap}
.nmC:hover{background:rgba(30,164,157,.26)}
.nmC i{font-style:normal;opacity:.6;font-size:10px}
/* 칩 안의 직급 — 이름보다 가볍게. 키는 이름이고 직급은 딸려 오는 값이다. */
.nmC .rl{font-weight:400;opacity:.72;font-size:10px;margin-left:1px}
/* 직급 분리 제안 */
/* 명함 이미지 — 가로:세로 1.62 는 한국 표준 명함(90x55) 비율이다 */
.cardimg{background:var(--card2);border:1px solid var(--bd);border-radius:7px;
  flex:0 0 auto;object-fit:cover;display:block}
.th{width:64px;aspect-ratio:1.62}
.th.lg{width:132px}
.cshots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:9px}
.cshot{position:relative;aspect-ratio:1.62;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.cshot img{width:100%;height:100%;object-fit:cover;display:block}
.cshot .tag{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;
  font:8.5px "JetBrains Mono",monospace;background:rgba(10,10,10,.72);color:var(--acc)}
.cshot .tag.e{color:#c76a6a}
/* 검토 행 — 이름 칸만 손대면 된다 */
.rvc{border:1px solid var(--bd);border-radius:10px;padding:11px 12px;background:var(--card2);margin-bottom:8px}
.rvc:last-of-type{margin-bottom:0}
.rvtop{display:flex;gap:11px;align-items:flex-start}
.rvb{flex:1;min-width:0}
.nmrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.nmrow .lb{font:9px "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--acc)}
.nmin{padding:5px 9px;border:1px solid var(--acc);border-radius:7px;background:var(--bg);
  color:var(--fg);font:600 13px inherit;width:132px}
.rvw{font:9.5px "JetBrains Mono",monospace;color:#d4a24c}
.rvm{font:10.5px "JetBrains Mono","SF Mono",monospace;color:var(--dim);margin-top:7px;line-height:1.75}
.rvm b{color:var(--mut);font-weight:400}
.unv{font:9px "JetBrains Mono",monospace;padding:1px 6px;border-radius:9px;
  border:1px solid #4a3a1e;background:rgba(212,162,76,.1);color:#d4a24c;margin-left:6px}
.cdrop{display:block;border:1px dashed var(--bd);border-radius:11px;padding:17px 14px;
  text-align:center;color:var(--mut);font-size:12px;cursor:pointer;line-height:1.7}
.cdrop:hover{border-color:var(--mut);color:var(--fg)}
.cdrop b{display:block;font:600 11px "JetBrains Mono",monospace;letter-spacing:.1em;
  color:var(--acc);margin-bottom:4px}
.rsp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 2px;
  border-top:1px solid var(--hair);font-size:11.5px}
.rsp:first-of-type{border-top:0}
.rsp .fr0{font-family:"JetBrains Mono","SF Mono",monospace;color:var(--mut);min-width:108px}
.rsp .ar{color:var(--dim)}
.rsp .to{font-weight:600}
.rsp .rw{font:10px "JetBrains Mono",monospace;color:var(--acc);
  border:1px solid rgba(30,164,157,.3);background:rgba(30,164,157,.14);
  padding:1px 7px;border-radius:9px}
.rsp .nn{font:10px "JetBrains Mono",monospace;color:var(--dim);margin-left:auto}
.metaC{font:10.5px "JetBrains Mono","SF Mono",monospace;color:var(--dim);margin-left:2px}
/* 저장 줄 — 폼 맨 아래. 폰에서는 화면 하단에 붙는다. */
.fnbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  margin-top:13px;padding-top:12px;border-top:1px solid var(--bd)}
.fnhint{font-size:10px;color:var(--dim);line-height:1.7;margin-top:8px}
/* 이름에 직급이 붙어 있을 때 명함 시트 맨 위에 서는 안내 */
.rwarn{border:1px solid rgba(30,164,157,.3);background:rgba(30,164,157,.08);
  border-radius:9px;padding:10px 12px;margin-bottom:12px;

let DATA = null, ENT = null, MAP = null, GEO = null, USER = null;

const KW = {meet:1.0, dinner:1.0, golf:1.0, lunch:0.8, coffee:0.6,
            call:0.5, mail:0.3, meal:1.0};
const KLBL = {meet:'미팅', coffee:'커피', lunch:'점심', dinner:'저녁', golf:'골프',
              call:'통화', mail:'메일', meal:'식사'};

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const VAULT = 'Obsidian BU - Shawn';

                 '&file=' + encodeURIComponent(String(p).replace(/\.md$/, ''));
const F = {

};

const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+

function spark(vals){
  const v = vals.filter(x=>x!=null);
  if (v.length<2) return '';
  const lo=Math.min(...v), hi=Math.max(...v), r=(hi-lo)||1, b='▁▂▃▄▅▆▇';
  return vals.map(x=>x==null?'·':b[Math.min(Math.floor((x-lo)/r*6),6)]).join('');
}

/* ── 인증 ─────────────────────────────────────── */
// 테마 — 다크가 기본. 고른 값만 기억한다.
const MODE = () => localStorage.getItem('om') || 'dark';
const setMode = m => { localStorage.setItem('om', m);

onAuthStateChanged(auth, u => {

function subscribe(uid){
  onSnapshot(doc(db,'users',uid,'origination','state'), s => {
    STATE = (s.exists() ? s.data().m : null) || {}; kpi(); if(TAB!=='idea'&&TAB!=='word') render();
  });
  onSnapshot(query(collection(db,'users',uid,'orig_inbox'),orderBy('at','desc'),limit(40)),
    s => { QUEUE = s.docs.map(d=>({id:d.id,...d.data()})); if(TAB==='idea'||TAB==='word'||TAB==='field') render(); });
  onSnapshot(query(collection(db,'users',uid,'deal_ideas'),orderBy('date','desc'),limit(500)),
    s => { DIDEA = s.docs.map(d=>({id:d.id,...d.data()})); if(TAB==='idea') render(); });
  onSnapshot(query(collection(db,'users',uid,'field_notes'),orderBy('date','desc'),limit(400)),
    s => { LOGS = s.docs.map(d=>({id:d.id,...d.data()})); if(TAB==='field'||TAB==='cad') render(); });
  onSnapshot(collection(db,'users',uid,'pc'), s => {
    PCM = {}; s.docs.forEach(d => { PCM[d.id] = d.data(); });
    if(TAB==='deal') render();
  });
  onSnapshot(collection(db,'users',uid,'cadence'), s => {
    CAD = {}; s.docs.forEach(d => { CAD[d.id] = d.data(); });
    if(TAB==='cad'||TAB==='field') render();
  });
  onSnapshot(doc(db,'users',uid,'origination','cfg'), s => {
    CFG = s.exists() ? s.data() : {};
    PCOL = (CFG.person_col === 'person2') ? 'person2' : 'person';
    pickPer(); if(TAB==='cad'||TAB==='field') render();
  });
  onSnapshot(collection(db,'users',uid,'person'), s => {
    PER1 = {}; s.docs.forEach(d => { PER1[d.id] = d.data(); });
    pickPer(); if(TAB==='cad') render();
  });
  onSnapshot(collection(db,'users',uid,'person2'), s => {
    PER2 = {}; s.docs.forEach(d => { PER2[d.id] = d.data(); });
    pickPer(); if(TAB==='cad') render();
  });
}
const cadKey = c => String(c).replace(/[\/#?\[\]]/g,'_').slice(0,120);
/* person2 는 '이름@첫소속' 이 키다. 같은 이름이 다른 회사에 있어도 갈라진다.
   이름으로 찾을 때는 색인을 거친다. */
function pickPer(){
  PER = (PCOL === 'person2') ? PER2 : PER1;
  PER_IDX = {};
  for(const k in PER){
    const p = PER[k]; if(!p.name) continue;
    const put = n => { n = String(n || '').trim(); if(!n) return; (PER_IDX[n] = PER_IDX[n] || []).push(k); };
    put(p.name); for(const a of (p.aliases || [])) put(a);
  }
}
function perKey(n){
  if(PCOL !== 'person2') return cadKey(n);
  const ks = PER_IDX[String(n).trim()] || [];
  const live = ks.filter(k => !PER[k].merged_into);
  return live[0] || ks[0] || null;
}
const orgSlug = o => String(o || '').toLowerCase().replace(/\(.*?\)/g,'').replace(/[^0-9a-z가-힣]/g,'').slice(0,16);
function mkKey(n, org){
  const base = cadKey(n) + (orgSlug(org) ? '@' + orgSlug(org) : '');
  let k = base, i = 2;
  while(PER2[k] && PER2[k].name !== n) k = base + '~' + (i++);
  return k;
}
// 기록 수정·삭제. 담기만 있고 되돌리는 길이 없으면 오타 하나도 못 고친다.
const logRef = id => doc(db,'users',USER.uid,'field_notes',id);
const updLog = (id, o) => USER ? updateDoc(logRef(id), o)
  : Promise.reject(new Error('로그인이 필요합니다'));
const delLog = id => USER ? deleteDoc(logRef(id))
  : Promise.reject(new Error('로그인이 필요합니다'));
const saveCad = (c, o) => USER
  ? setDoc(doc(db,'users',USER.uid,'cadence',cadKey(c)), {company:c, ...o}, {merge:true})
  : Promise.reject(new Error('로그인이 필요합니다'));
const savePer = (n, o) => {
  if(!USER) return Promise.reject(new Error('로그인이 필요합니다'));
  if(PCOL !== 'person2')
    return setDoc(doc(db,'users',USER.uid,'person',cadKey(n)), {name:n, ...o}, {merge:true});
  // 손으로 적은 값은 출처를 manual 로 남긴다 — 가져오기가 절대 못 덮는다
  const k = perKey(n) || mkKey(n, o.org || '');
  const src = {};
  for(const f of ['org','role','dept','phone','mail','url'])
    if(o[f] !== undefined && o[f] !== null) src[f] = {v:o[f], from:'manual', at:todayStr()};
  const body = {name:n, ...o, touched:new Date().toISOString()};
  if(Object.keys(src).length) body.src = src;
  return setDoc(doc(db,'users',USER.uid,'person2',k), body, {merge:true});
};
const saveState = () => USER &&
  setDoc(doc(db,'users',USER.uid,'origination','state'), {m:STATE, at:serverTimestamp()});
const enqueue = (kind, payload) => USER
  ? addDoc(collection(db,'users',USER.uid,'orig_inbox'),
      {kind, ...payload, status:'pending', at:serverTimestamp()})
  : Promise.reject(new Error('로그인이 필요합니다'));

const stOf = c => (STATE[c] && STATE[c].st) || 'new';
const SLBL = {new:'신규',live:'PIPELINE',watch:'WATCHLIST',seen:'검토',drop:'제외'};
const SORD = ['new','live','watch','seen','drop'];   // 상태 버튼 순서

/* ── 스캔·관심 ─────────────────────────────────── */
const SORTS = [
  ['ev','공시 많은순',(a,b)=>b.nev-a.nev||a.n.localeCompare(b.n)],
  ['debt','차입금 증가',(a,b)=>(b.dg==null?-9:b.dg)-(a.dg==null?-9:a.dg)],
  ['fcf','FCF 낮은순',(a,b)=>(a.fc==null?9e15:a.fc)-(b.fc==null?9e15:b.fc)],
  ['margin','마진 악화',(a,b)=>(a.mg==null?9:a.mg)-(b.mg==null?9:b.mg)],
  ['rev','매출 역성장',(a,b)=>(a.rg==null?9:a.rg)-(b.rg==null?9:b.rg)],
  ['score','스코어',(a,b)=>b.sc-a.sc],
];
const FILTS = [['all','전체'],['new','미검토'],['watch','관심'],['seen','검토'],
               ['nodrop','제외 숨김']];

function rebuild(){
  const q = ($('q').value||'').trim().toLowerCase();
  let rows = DATA.companies;
  if (TAB==='watch') rows = rows.filter(r=>['watch','live'].indexOf(stOf(r.c))>=0);
  else if (FILT==='nodrop') rows = rows.filter(r=>stOf(r.c)!=='drop');
  else if (FILT!=='all') rows = rows.filter(r=>stOf(r.c)===FILT);
  if (q) rows = rows.filter(r=>r.n.toLowerCase().includes(q)||(r.s||'').includes(q));
  view = rows.slice().sort(SORTS.find(s=>s[0]===SORT)[2]);
  shown = 0; $('list').innerHTML='';
  $('cnt').textContent = view.length.toLocaleString()+'사'+(q?' · "'+q+'"':'');
  page();
}
function page(){
  const frag=document.createDocumentFragment(), end=Math.min(shown+PAGE,view.length);
  for(let i=shown;i<end;i++) frag.appendChild(rowEl(view[i]));
  $('list').appendChild(frag); shown=end;
  const m=$('more');
  if(shown<view.length){m.style.display='';m.textContent='더 보기 ('+(view.length-shown).toLocaleString()+'사 남음)';}
  else m.style.display='none';
  if(!view.length) $('list').innerHTML='<div class="empty">해당하는 회사가 없습니다</div>';
}
function rowEl(r){
  const d=document.createElement('details'); d.className='row';
  const st=stOf(r.c);
  d.innerHTML='<summary><span class="nm">'+esc(r.n)+'</span>'+
    (r.s?'<span class="cd">'+r.s+'</span>':'')+
    '<span class="spk">'+spark(r.y.map(y=>(r.A[y]||{}).revenue))+'</span>'+
    '<span class="st st-'+st+'">'+SLBL[st]+'</span>'+
    (r.nev?'<span class="evn">공시 '+r.nev+'</span>':'')+
    (r.as?'<span class="sz">자산 '+r.as.toLocaleString()+'백만</span>':'')+'</summary>';
  d.addEventListener('toggle',()=>{ if(d.open&&!d.dataset.b){
    d.insertAdjacentHTML('beforeend', body(r)); d.dataset.b='1'; }});
  return d;
}
function table(periods,src,lab){
  if(!periods.length) return '';
  let h='<div class="unit">단위: 백만원 <em>(%·x·일수는 행별 표기)</em></div>'+
    '<div class="wrap"><table class="tt"><thead><tr><th></th>'+
    periods.map(p=>'<th>'+lab(p)+'</th>').join('')+'</tr></thead><tbody>';
  for(const k of DATA.keys){
    const cells=periods.map(p=>(src[p]||{})[k.k]);
    if(cells.every(v=>v==null)) continue;
    h+='<tr><th>'+esc(k.l)+'</th>'+cells.map(v=>'<td>'+
      (v==null?'<span style="color:var(--dim)">·</span>':F[k.f](v))+'</td>').join('')+'</tr>';
  }
  return h+'</tbody></table></div>';
}
function body(r){
  const st=stOf(r.c); let h='<div class="bd">';
  if(r.tg.length) h+='<div class="tags">'+r.tg.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
  h+='<div class="lbl">연간 <em>'+r.y[0]+'-'+r.y[r.y.length-1]+'</em></div>'+table(r.y,r.A,p=>p.slice(2));
  if(r.q.length) h+='<div class="lbl">분기 <em>최근 '+r.q.length+'개</em></div>'+
    table(r.q,r.Q,p=>p.slice(2,4)+'.'+p.slice(4));
  else h+='<div class="lbl">분기 <em>미수집</em></div>';
  h+='<div class="lbl">자본활동 공시'+(r.nev>r.ev.length?
      ' <em>최근 '+r.ev.length+'건 / 총 '+r.nev+'건</em>':'')+'</div>';
  h+= r.ev.length ? r.ev.map(e=>'<div class="ev"><span class="evd">'+
      e[0].slice(2,4)+'.'+e[0].slice(4,6)+'.'+e[0].slice(6,8)+'</span><span class="cat">'+
      esc(e[1])+'</span><a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo='+e[3]+
      '" target="_blank" rel="noopener">'+esc(e[2])+'</a></div>').join('')
    : '<div class="empty" style="padding:6px 0;text-align:left">자본활동 공시 없음 '+
      '<em style="font-style:normal;color:var(--dim)">('+(DATA.ev_from||'')+
      ' 이후 전수 수집 기준. 미수집이 아니라 해당 공시가 없다는 뜻)</em></div>';
  const vb=r.s&&DATA.vault[r.s];
  if(vb){
    h+='<div class="lbl">vault <em><a href="'+obs(vb.p)+'" style="color:var(--acc)">'+
      esc(vb.note)+' →</a> · 링크 '+vb.tot+'건</em></div><div class="vs">';
    const ovk={parent_group:'그룹',sector:'섹터',sub_industry:'세부'};
    const ov=Object.keys(ovk).filter(k=>vb.ov[k]);
    if(ov.length) h+='<div class="ovr">'+ov.map(k=>'<span>'+ovk[k]+' '+esc(vb.ov[k])+'</span>').join('')+'</div>';
    for(const s of vb.sec){
      h+='<b>'+esc(s.l)+' <span style="color:var(--dim);font-weight:400">'+s.n+'</span></b>';
      h+=s.i.map(x=>'<a class="vi" href="'+obs(x.p)+'">'+(x.d?'<span>'+x.d.slice(2)+'</span>':'<span>·</span>')+
        '<i>'+esc(x.t)+(x.x?'<em>'+esc(x.x)+'</em>':'')+'</i></a>').join('');
    }
    h+='</div>';
  }
  h+='<div class="acts">'+['live','watch','seen','drop'].map(k=>
    '<button class="ab'+(st===k?' on':'')+'" data-c="'+r.c+'" data-st="'+k+'">'+SLBL[k]+'</button>').join('')+
    '<button class="ab" data-idea="'+r.c+'">Idea 등록 →</button>'+
    '<a class="ab" href="https://dart.fss.or.kr/dsab007/main.do?textCrpNm='+
      encodeURIComponent(r.n)+'" target="_blank" rel="noopener">DART →</a></div>'+
    '<textarea class="memo" data-memo="'+r.c+'" placeholder="메모">'+
      esc((STATE[r.c]||{}).memo||'')+'</textarea>';
  return h+'</div>';
}

/* ── 검색되는 선택기 ───────────────────────────────
   1,660곳을 <select> 로 두면 폰에서 못 쓴다. 타이핑하면 걸러지고
   목록에 없으면 적은 그대로 쓴다(로펌·컨설팅처럼 등록이 없는 곳). */
const COMBO = {};   // id -> 확정된 값

function comboHTML(id, ph){
  return '<div class="combo" data-combo="'+id+'">'+
    '<input id="'+id+'" placeholder="'+ph+'" autocomplete="off">'+
    '<ul id="'+id+'-l"></ul></div>';
}
function comboFill(id, q){
  const ul=$(id+'-l'); if(!ul||!ENT) return;
  const s=(q||'').trim().toLowerCase();
  let rows=ENT.items;
  if(s) rows=rows.filter(x=>x.n.toLowerCase().includes(s));
  const cap=rows.slice(0,60);
  let h='';
  let lastG='';
  for(const x of cap){
    if(x.g!==lastG){
      const gl=(ENT.groups.find(g=>g.k===x.g)||{}).l||x.g;
      h+='<li class="hd">'+esc(gl)+'</li>'; lastG=x.g;
    }
    h+='<li data-v="'+esc(x.n)+'"><b>'+esc(x.n)+'</b>'+
       (x.p?'<i>vault</i>':'')+'</li>';
  }
  if(s && !cap.some(x=>x.n===q))
    h='<li class="new" data-v="'+esc(q)+'">+ "'+esc(q)+'" 그대로 쓰기</li>'+h;
  if(!h) h='<li class="hd">일치하는 곳이 없습니다</li>';
  if(rows.length>cap.length)
    h+='<li class="hd">+'+(rows.length-cap.length).toLocaleString()+'곳 더 — 더 적어보세요</li>';
  ul.innerHTML=h; ul.classList.add('on');
}

async function saveContact(company, kind, people, extra){
  if(!USER) { needLogin(); return false; }
  const rec = Object.assign({
    company: company, title: company, date: todayStr(),
    kind: kind, weight: (KW[kind] || 1), people: people || [],
    zone: '', zone_etc: '', place: '', note: '', mode: 'quick', status: 'done'
  }, extra || {});
  const xy = resolveXY(rec.place, rec.zone, company);
  rec.x = xy[0]; rec.y = xy[1]; rec.src = xy[2];
  await addDoc(collection(db, 'users', USER.uid, 'field_notes'),
    Object.assign({}, rec, {at: serverTimestamp()}));
  return true;
}

  }
  if(e.target.id === 'rv-new-ok'){
    const sel = rvNewRows().filter(r => r.status === 'open' && !rvOff[r.id]);
    if(!sel.length) return;
    if(!confirm(sel.length.toLocaleString() + '명을 인물로 등록합니다. 이력에서 되돌릴 수 있습니다.')) return;
    rvBusy = '등록 중… ' + sel.length.toLocaleString() + '명'; render();
    try{ await approveRows(sel, 'new', '신규 ' + sel.length + '명' + (rvFilt !== 'all' ? ' · ' + rvFilt : '')); }
    catch(x){ alert('실패 — ' + x.message); }
    rvBusy = ''; render(); return;
  }
  const rvu = e.target.closest('[data-rvupd]');
  if(rvu){
    const r = impById(rvu.dataset.rvupd); if(!r) return;
    rvBusy = '채우는 중…'; rvu.disabled = true;
    try{ await approveRows([r], 'update', r.name + ' 채움'); }catch(x){ alert('실패 — ' + x.message); }
    rvBusy = ''; render(); return;
  }
  if(e.target.id === 'rv-upd-all'){
    const rows = rvUpds(); if(!rows.length) return;
    rvBusy = '채우는 중… ' + rows.length + '명'; render();
    try{ await approveRows(rows, 'update', '기존 채움 ' + rows.length + '명'); }catch(x){ alert('실패 — ' + x.message); }
    rvBusy = ''; render(); return;
  }
  const ud = e.target.closest('[data-undo]');
  if(ud){
    const b = BATCH.find(x => x.id === ud.dataset.undo); if(!b) return;
    if(!confirm('"' + (b.label || b.kind) + '" 을(를) 되돌립니다. 그 뒤 직접 고친 사람은 건너뜁니다.')) return;
    rvBusy = '되돌리는 중…'; ud.disabled = true;
    try{ const sk = await undoBatch(b); if(sk) alert(sk + '명은 그 뒤 직접 고쳐서 건너뛰었습니다.'); }
    catch(x){ alert('실패 — ' + x.message); }
    rvBusy = ''; render(); return;
  }

  // 조직 / 인물 축 전환
  const cv = e.target.closest('[data-cv]');
  if(cv){ cadView = cv.dataset.cv; cadOpen = perOpen = null; render(); return; }

  // 인물 행에서 컨택 담기 — 회사는 명함에 적힌 소속으로 들어간다
  const pq = e.target.closest('[data-pq]');
  if(pq){
    const nm = pq.dataset.pq;
    const row = perAgg().find(x => x.name === nm) || {};
    pq.disabled = true; pq.textContent = '담는 중…';
    try{ if(await saveContact(row.org || nm, 'meet', [nm])) pq.textContent = '담았습니다'; }
    catch(x){ pq.textContent = '실패 — ' + x.message; pq.disabled = false; }
    return;
  }

  const ps = e.target.closest('[data-ps]');
  if(ps){ perSheet = ps.dataset.ps; render(); return; }

  const pwk = e.target.closest('.sheet [data-pwk]');
  if(pwk){
    pwk.parentNode.querySelectorAll('[data-pwk]').forEach(x => x.classList.remove('on'));
    pwk.classList.add('on'); return;
  }
  const pt = e.target.closest('.sheet [data-ptier]');
  if(pt){
    pt.parentNode.querySelectorAll('[data-ptier]').forEach(x => x.classList.remove('on'));
    pt.classList.add('on'); return;
  }
  if(e.target.id === 'pr-save'){
    const sh = e.target.closest('.sheet');
    const w = sh.querySelector('[data-pwk].on');
    const t = sh.querySelector('[data-ptier].on');
    const g = id => (sh.querySelector(id).value || '').trim();
    const o = {org:g('#pr-org'), role:g('#pr-role'), phone:g('#pr-phone'),
               mail:g('#pr-mail'), memo:g('#pr-memo'), tags:g('#pr-tags'),
               tier:(t && t.dataset.ptier) || null,
               target_wk: w ? +w.dataset.pwk : defWk(),
               unverified: false};   // 사람이 보고 저장했으니 더 이상 미확인이 아니다
    try{ await savePer(perSheet, o); }catch(x){ alert(x.message); return; }
    perSheet = null; render(); return;
  }

  // 추적 안 함 / 재개 — 한 명
  const ptk = e.target.closest('[data-ptk]');
  if(ptk){
    const nm = ptk.dataset.ptk, off = perOf(nm).tier === 'off';
    try{ await savePer(nm, {tier: off ? null : 'off'}); }catch(x){ alert(x.message); }
    render(); return;
  }
  const pmg = e.target.closest('[data-pmg]');
  if(pmg){ mgSheet = {from: pmg.dataset.pmg, q: ''}; render(); return; }
  const mgto = e.target.closest('[data-mgto]');
  if(mgto && mgSheet){
    const from = mgSheet.from, to = mgto.dataset.mgto;
    if(!confirm(from + ' 을(를) ' + to + ' 에 합칩니다. 남는 이름은 ' + to + ' 입니다.')) return;
    try{ await doMerge(from, to); }catch(x){ alert('실패 — ' + x.message); return; }
    mgSheet = null; perOpen = to; render(); return;
  }
  const mgs = e.target.closest('[data-mgsplit]');
  if(mgs){
    try{ await unmerge(mgs.dataset.mgsplit, mgs.dataset.nm); }catch(x){ alert('실패 — ' + x.message); }
    render(); return;
  }
  const pdl = e.target.closest('[data-pdel]');
  if(pdl){
    const nm = pdl.dataset.nm, act = pdl.dataset.pdel;
    try{ await perAct([nm], act); }catch(x){ alert(x.message); }
    render(); return;
  }
  if(e.target.closest('[data-ppick]')){ perPick = perPick ? null : {}; render(); return; }
  if(e.target.id === 'pk-x'){ perPick = null; render(); return; }
  const pkgo = e.target.closest('[data-pkgo]');
  if(pkgo){
    const names = Object.keys(perPick || {}); if(!names.length) return;
    pkgo.disabled = true;
    try{ if(!(await perAct(names, pkgo.dataset.pkgo))){ pkgo.disabled = false; return; } }
    catch(x){ alert('실패 — ' + x.message); }
    perPick = null; render(); return;
  }
  // 인물 행 펼치기 (버튼 클릭이 아닐 때만). 선택 모드면 체크 토글
  const pdr = e.target.closest('[data-per]');
  if(pdr && perPick && !e.target.closest('button')){
    const nm = pdr.dataset.per;
    if(perPick[nm]) delete perPick[nm]; else perPick[nm] = 1;
    render(); return;
  }
  if(pdr && !e.target.closest('button')){
    const nm = pdr.dataset.per;
    perOpen = (perOpen === nm) ? null : nm;
    render(); return;
  }

  // Cadence 행에서 바로 컨택 담기
  const cq = e.target.closest('[data-cq]');
  if(cq){
    const c = cq.dataset.cq;
    cq.disabled = true; cq.textContent = '담는 중…';
    try{ if(await saveContact(c, 'meet', [])) { cq.textContent = '담았습니다'; } }
    catch(x){ cq.textContent = '실패 — ' + x.message; cq.disabled = false; }
    return;
  }

  // Cadence 행 펼치기 (버튼 클릭이 아닐 때만)
  const cdr = e.target.closest('[data-cad]');
  if(cdr && !e.target.closest('button')){
    const c = cdr.dataset.cad;
    cadOpen = (cadOpen === c) ? null : c;
    render(); return;
  }

  // 컨택 종류 선택 — 다시 그리지 않고 버튼 상태만 바꾼다
  const kb = e.target.closest('[data-kind]');
  if(kb){
    fnKind = kb.dataset.kind;
    const box = kb.parentNode;
    box.querySelectorAll('[data-kind]').forEach(x => x.classList.remove('on'));
    kb.classList.add('on');
    return;
  }

  // 인물 칩 토글 / 새 이름
  const pp = e.target.closest('[data-pp]');
  if(pp){
    const n = pp.dataset.pp, i = fnPeople.indexOf(n);
    if(i >= 0) fnPeople.splice(i, 1); else fnPeople.push(n);
    pp.classList.toggle('on', i < 0);      // 다시 그리지 않는다
    return;
  }
  if(e.target.closest('[data-ppnew]')){
    // 직급은 받지 않는다. 이름이 명함의 키라서 섞이면 승진 때 이력이 쪼개진다.
    const n = (prompt('이름만 입력하세요 — 직급은 명함에서 관리합니다\n(예: 김성호)') || '').trim();
    if(n && fnPeople.indexOf(n) < 0) fnPeople.push(n);
    render(); return;
  }

  // 기록 범위 — 컨택만 / 노트·녹음까지
  const sc = e.target.closest('[data-sc]');
  if(sc){ fnQuick = (sc.dataset.sc === 'q'); render(); return; }

  // 기록 저장 — 빠른 모드·예정 모두 이 핸들러로 들어온다
  if(e.target.id === 'fn-quick'){
    const c = comboVal('fn-c');
    if(!c){ $('fn-qmsg').textContent = '상대를 고르세요'; return; }
    e.target.disabled = true;
    $('fn-qmsg').textContent = fnPlan ? '예정 담는 중…' : '담는 중…';
    try{
      const zsel = $('fn-z'), psel = $('fn-l');
      const ag = $('fn-ag');
      const ok = await saveContact(c, fnKind, fnPeople.slice(), {
        zone: zsel ? zsel.value : '',
        zone_etc: (zsel && zsel.value === 'ETC' && $('fn-ze')) ? $('fn-ze').value.trim() : '',
        place: psel ? psel.value.trim() : '',
        date: fnDate || todayStr(),
        status: fnPlan ? 'planned' : 'done',
        agenda: (fnPlan && ag) ? ag.value.trim() : ''});
      if(ok){ fnPeople = [];
        $('fn-qmsg').textContent = fnPlan ? '예정에 담았습니다' : '담았습니다';
        if(fnPlan){ fnPlan = false; fnDate = ''; } }
    }catch(x){ $('fn-qmsg').textContent = '실패 — ' + x.message; }
    e.target.disabled = false;
    setTimeout(() => { if($('fn-qmsg')) render(); }, 700);
    return;
  }
});

const QLBL = {pending:['대기','q-wait'],running:['처리중','q-run'],
              done:['완료','q-ok'],error:['실패','q-err']};
const qWhen = q => (q.at&&q.at.toDate)
  ? q.at.toDate().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit'}) : '방금';

function queueRows(kind){
  const rows = QUEUE.filter(q=>q.kind===kind);
  if(!rows.length) return '<div class="empty" style="padding:10px 0">담은 항목이 없습니다</div>';
  return rows.map(q=>{
    const [lb,cls] = QLBL[q.status]||QLBL.pending;
    return '<div class="qrow"><span class="evd">'+esc(qWhen(q))+'</span>'+
      '<span style="flex:1;min-width:120px">'+esc(q.title||q.target||q.company||'—')+'</span>'+
      '<span class="qs '+cls+'">'+lb+'</span>'+
      (q.result_path?'<a class="ab" style="padding:3px 9px" href="'+obs(q.result_path)+'">노트 →</a>':'')+
      (q.error?'<span style="color:#9b2c2c;font-size:10px;width:100%">'+esc(q.error)+'</span>':'')+
      '</div>';
  }).join('');
}

/* DEALIDEA */
const DI_LBL = {pipeline:'파이프라인',deal:'딜 이력',news:'기사',judgment:'내 판단',entity:'기관·인물',visit:'방문'};
function paneDealIdea(){
  if(!DIDEA.length) return '<div class="card"><div class="di-h"><b>Today\'s Deal Idea</b>'+
    '<span>AUTO · DAILY 06:00</span></div><div style="font-size:12.5px;color:var(--mut)">'+
    (USER?'아직 생성된 아이디어가 없습니다. 내일 06:00 브리핑 뒤에 채워집니다.':'로그인하면 오늘의 아이디어가 보입니다.')+'</div></div>';
  // 날짜별 아카이브 — 최신이 기본, 칩으로 지난 날짜를 연다
  const days = [...new Set(DIDEA.map(x=>x.date))].sort().reverse();
  if(!DI_DAY || !days.includes(DI_DAY)) DI_DAY = days[0];
  const day = DI_DAY, latest = day===days[0];
  const today = DIDEA.filter(x=>x.date===day).sort((a,b)=>(b.fit||0)-(a.fit||0));
  const kept = DIDEA.filter(x=>x.date!==day && (x.status==='saved'||x.status==='kept'))
    .sort((a,b)=>a.date<b.date?1:-1);
  const strip = days.length<2 ? '' : '<div class="dd-s">'+days.map(d=>{
      const xs = DIDEA.filter(x=>x.date===d), sv = xs.filter(x=>x.status==='saved'||x.status==='kept').length;
      return '<button class="dd'+(d===day?' on':'')+'" data-day="'+esc(d)+'">'+esc(d.slice(5).replace('-','.'))+
        '<small>'+xs.length+(sv?' · 저장 '+sv:'')+'</small></button>';
    }).join('')+'</div>';
  const row = x => {
    const on = x.status==='kept'||x.status==='saved';
    const src = (x.sources||[]).map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>').join(' · ');
    let foot = '';
    if(x.status==='kept') foot = '<div class="pend">저장 대기 — PC가 10분 안에 vault 연결을 찾아 노트를 만듭니다</div>';
    if(x.status==='saved' && x.saved){
      const L = x.saved.links||{};
      const cnt = Object.keys(DI_LBL).filter(k=>L[k]).map(k=>DI_LBL[k]+' '+L[k]).join(' · ');
      foot = '<div class="sv">저장됨 → '+esc(x.saved.path.split('/').pop().replace(/\.md$/,''))+
        ' <i>('+esc(x.saved.how||'')+')</i><br>vault 연결: '+(cnt||'<i>찾은 연결 없음</i>')+
        (x.saved.entity?'':' <i>· 대상 회사 노트 없음</i>')+
        ((x.saved.top||[]).length?'<br><i>'+x.saved.top.map(t=>esc(t.t)).join(' · ')+'</i>':'')+'</div>';
    }
    if(x.error) foot += '<div class="pend" style="color:#d9534f">오류 — '+esc(x.error)+'</div>';
    return '<div class="di'+(on?' on':'')+'"><button class="ck" data-di="'+esc(x.id)+'" aria-label="저장"></button><div>'+
      '<div class="tt"><span class="ang">'+esc(x.angle||'other')+'</span><em>'+esc(x.target)+'</em> — '+
        esc((x.title||'').split('—').pop().trim())+'</div>'+
      '<div class="why">'+esc(x.trigger||'')+
        ((x.facts||[]).length?'<ul>'+x.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>':'')+
        ((x.interpretation||[]).length?'<div class="itp">추론 · '+x.interpretation.map(esc).join(' / ')+'</div>':'')+'</div>'+
      '<div class="src">근거 '+src+'</div>'+foot+'</div>'+
      '<div class="sc">'+(x.fit==null?'—':x.fit)+'<small>FIT</small></div></div>';
  };
  return strip+'<div class="card"><div class="di-h"><b>'+(latest?'Today\'s Deal Idea':'Deal Idea Archive')+
    ' <span style="font-weight:400;color:var(--mut);letter-spacing:0">— '+
    esc(day)+' · 기사 '+(today[0].n_articles||'?')+'건 기준</span></b><span>체크하면 vault 연결을 찾아 저장</span></div>'+
    today.map(row).join('')+'</div>'+
    (kept.length?'<div class="lbl">다른 날짜에서 저장한 것</div><div class="card">'+
      kept.slice(0,30).map(x=>'<div class="di-k" data-day="'+esc(x.date)+'" style="cursor:pointer"><span><span class="ang" style="font-size:10px;color:#c9a14a;border:1px solid #4a3d22;padding:1px 6px;border-radius:4px;margin-right:6px">'+
        esc(x.angle)+'</span>'+esc(x.title||x.target)+'</span><span>'+esc(x.date)+'</span></div>').join('')+'</div>':'')+
    '<div class="lbl">직접 담기</div>';
}

/* ── 좌표 해석 ─────────────────────────────────
   landmark → dong → gu → 권역 안 고정 지터(회사명 해시). 근거는 src 로 남긴다. */
function hash32(s){ let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0; }

function resolveXY(place, zone, company){
  if(!GEO) return [null,null,''];
  const p=(place||'').trim();
  if(p){
    for(const k of Object.keys(GEO.landmark))
      if(p.includes(k)) return [...GEO.landmark[k],'landmark'];
    for(const k of Object.keys(GEO.dong))
      if(p.includes(k)) return [...GEO.dong[k],'dong'];
    for(const k of Object.keys(GEO.gu))
      if(p.includes(k)) return [...GEO.gu[k],'gu'];
  }
  const rep={YBD:'영등포구',CBD:'중구',GBD:'강남구'}[zone];
  if(!rep||!GEO.gu[rep]) return [null,null,''];
  const c=GEO.gu[rep], h=hash32(company||'');
  const a=(h%3600)/3600*Math.PI*2, r=14+((h>>12)%26);
  return [+(c[0]+r*Math.cos(a)).toFixed(1), +(c[1]+r*Math.sin(a)).toFixed(1), 'jitter'];
}

/* -- 커버리지 -------------------------------------
   권역별 마지막 컨택 경과. 목표는 전역 기본 주기를 따른다. */
function coverage(){
  const zs = ['YBD','CBD','GBD'];
  const last = {}, cnt = {};
  for(const l of doneLogs()){
    const z = l.zone; if(zs.indexOf(z) < 0) continue;
    cnt[z] = (cnt[z]||0) + 1;
    if(!last[z] || l.date > last[z]) last[z] = l.date;
  }
  const lim = defWk() * 7;
  const ZKO = {YBD:'여의도', CBD:'광화문', GBD:'강남'};
  const cells = zs.map(z => {
    const d = last[z] ? daysAgo(last[z]) : null;
    const over = (d != null) && (d > lim);          // 기록이 없으면 '필요'가 아니라 '없음'
    const t = d == null ? 0 : Math.max(0, 1 - Math.min(d, lim*2) / (lim*2));
    const bgv = Math.round(18 + 60 * t);
    return '<div class="zc" style="background:rgb(' + Math.round(bgv*0.55) + ',' +
      Math.round(bgv*0.78) + ',' + Math.round(bgv*1.35) + ')">' +
      (over ? '<span class="zf">필요</span>' : '') +
      '<b>' + (cnt[z]||0) + '</b>' + z + ' ' + ZKO[z] +
      '<em>' + (d == null ? '기록 없음' : '최근 ' + d + '일 전') + '</em></div>';
  }).join('');

  const rows = cadAgg().filter(r => r.st === 'l');
  const t1n = rows.filter(r => r.t1).length;
  const top = rows.slice(0, 3).map(r => esc(r.company) + ' ' + r.days + '일').join(' · ');
  const sum = !rows.length ? '' :
    '<div class="cdr" data-goto="cad" style="margin-top:9px">' +
      '<div class="cdr1"><b style="color:var(--late)">컨택 필요 ' + rows.length + '곳</b>' +
      '<span class="cdm">T-1 ' + t1n + ' · 기본 ' + (rows.length - t1n) + '</span></div>' +
      '<div class="cdr2">' + top + (rows.length > 3 ? ' 외 ' + (rows.length-3) + '곳' : '') +
      ' — 탭하면 Cadence로</div></div>';

  return '<div class="lbl" style="margin-top:14px">권역 커버리지 ' +
    '<em>목표 ' + defWk() + '주</em></div><div class="zrow">' + cells + '</div>' + sum;
}

function heatmap(){
  if(!MAP) return '';
  const cnt={CBD:0,YBD:0,GBD:0}, days={};
  for(const l of doneLogs()){
    if(cnt[l.zone]!=null) cnt[l.zone]++;
    days[l.date]=(days[l.date]||0)+1;
  }
  const mx=Math.max(1,...Object.values(cnt));
  let g='';
  for(let i=13;i>0;i--)
    g+='<g transform="translate(0,'+i+')">'+
       Object.values(MAP.gu).map(d=>'<path d="'+d+'" fill="var(--map-ext)"/>').join('')+'</g>';
  g+=Object.values(MAP.gu).map(d=>'<path d="'+d+
    '" fill="var(--map-land)" stroke="var(--map-bd)" stroke-width="1.1" stroke-linejoin="round"/>').join('');
  for(const z of ['CBD','YBD','GBD']){
    const zo=MAP.zones[z], ratio=cnt[z]/mx;
    for(const gu of zo.gu){
      g+='<g filter="url(#glow)" opacity="'+(0.22+0.5*ratio).toFixed(2)+'"><path d="'+
         MAP.gu[gu]+'" fill="var(--map-heat)"/></g>';
      g+='<path d="'+MAP.gu[gu]+'" fill="var(--map-heat)" fill-opacity="'+
         (0.14+0.62*ratio).toFixed(2)+'" stroke="var(--map-heat)" stroke-width="1.8" '+
         'stroke-linejoin="round"/>';
    }
    const c=zo.c;
    g+='<text x="'+c[0]+'" y="'+(c[1]-4)+'" text-anchor="middle" font-size="30" '+
       'font-weight="700" fill="var(--map-ink)" opacity="0.9">'+cnt[z]+'</text>'+
       '<text x="'+c[0]+'" y="'+(c[1]+15)+'" text-anchor="middle" font-size="12" '+
       'font-weight="600" letter-spacing="1.6" fill="var(--map-sub)">'+z+'</text>'+
       '<text x="'+c[0]+'" y="'+(c[1]+30)+'" text-anchor="middle" font-size="11" '+
       'fill="var(--map-sub)" opacity="0.8">'+zo.ko+'</text>';
  }
  // 방문 도트 — 한 건에 하나. 같은 자리에 쌓이면 투명도가 겹쳐 저절로 진해진다
  const spot={};
  for(const l of doneLogs()){
    let x=l.x,y=l.y;
    if(x==null||y==null){ const r=resolveXY(l.place,l.zone,l.company); x=r[0]; y=r[1]; }
    if(x==null) continue;
    const k=x+','+y; (spot[k]=spot[k]||[]).push(l);
  }
  for(const k in spot){
    const [x,y]=k.split(',').map(Number);
    spot[k].forEach((l,i)=>{
      const a=i*2.399963, r=3.6*Math.sqrt(i);
      g+='<circle cx="'+(x+r*Math.cos(a)).toFixed(1)+'" cy="'+(y+r*Math.sin(a)).toFixed(1)+
         '" r="4.6" fill="#9fc4f0" fill-opacity="0.34"><title>'+
         esc(l.company+' · '+l.date+(l.place?' · '+l.place:''))+'</title></circle>';
    });
  }
  const cells=[]; const d0=new Date(); d0.setDate(d0.getDate()-62);
  for(let i=0;i<63;i++){
    const d=new Date(d0); d.setDate(d0.getDate()+i);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+
      String(d.getDate()).padStart(2,'0');
    const v=days[key]||0;
    cells.push('<div class="cel l'+(v===0?0:Math.min(v,4))+'" title="'+key+' · '+v+'건"></div>');
  }
  return '<div class="lbl">권역 방문 <em>기록 '+doneLogs().length+'건</em></div>'+
    '<div class="mapbox"><svg viewBox="'+MAP.vb+'" style="width:100%;display:block">'+
      '<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%">'+
      '<feGaussianBlur stdDeviation="11"/></filter></defs>'+g+'</svg></div>'+
    '<div class="lg"><span>여의도 <b>'+cnt.YBD+'</b></span><span>강남 <b>'+cnt.GBD+
      '</b></span><span>광화문 <b>'+cnt.CBD+'</b></span></div>'+
    '<div class="lbl" style="margin-top:14px">최근 9주 <em>하루 한 칸</em></div>'+
    '<div class="cal">'+cells.join('')+'</div>'+
    '<div class="callg"><span>적음</span>'+
      [0,1,2,3,4].map(i=>'<i class="cel l'+i+'"></i>').join('')+'<span>많음</span></div>'+
    coverage();
}



/* -- 빠른 컨택 --------------------------------------
   노트도 녹음도 없이 컨택만 남긴다. 큐를 태우지 않으므로 LLM 비용이 0이다. */
function peopleOf(company){
  const seen = {};
  for(const l of LOGS){
    if((l.company||l.title) !== company) continue;
    for(const n of (l.people||[])) seen[n] = (seen[n]||0) + 1;
  }
  return Object.keys(seen).sort((a,b) => seen[b] - seen[a]).slice(0, 8);
}

/* 강도 = 색 하나 + opacity. 연속값은 비슷한 둘을 못 가리므로 계단으로 끊는다.
   캘린더 히트맵(.cel l1~l4)과 같은 4단계다. */
const STEPS = [0.34, 0.56, 0.78, 1.0];
const bucket = (v, cuts) => {           // cuts 개수 = 3, 결과 0~3
  if (v == null) return null;
  let i = 0;
  while (i < cuts.length && v >= cuts[i]) i++;
  return i;
};
const HOLD_CUTS = [7, 10, 13];          // 보유연수 — 5~7 / 7~10 / 10~13 / 13+
const CAD_CUTS  = [0.6, 1.0, 1.5];      // 컨택 경과율 — 목표 대비
const inten = (v, cuts) => { const b = bucket(v, cuts); return b == null ? null : STEPS[b]; };
const swatch = o => o == null ? '<span class="sw" style="opacity:.12"></span>'
  : '<span class="sw" style="opacity:' + o + '"></span>';
const holdLegend = () =>
  '<span class="swlg">5Y' + STEPS.map(o => '<i style="opacity:' + o + '"></i>').join('') +
  '13Y+</span>';

    '주관사 보도 없음</div>';
  if(full && did) h += '<div style="margin:0 0 6px 80px">' +
    '<button class="chip" data-pc="' + esc(did) + '" data-pcn="' + esc(d[0]) + '">' +
    (ask ? '메모 수정' : '매각희망가·메모') + '</button></div>';
  return h;
}

function gpCard(g){
  const open = dealOpen === g.i;
  const need = g.need || [], ex = g.exit || [];
  let h = '<div class="cdr' + (open ? ' op' : '') + '" data-deal="' + esc(g.i) + '">' +
    '<div class="cdr1">' +
      (need.length ? '<span class="due">EXIT DUE ' + need.length + '</span>' : '') +
      '<b>' + esc(g.n) + '</b>' +
      (g.off ? '<span class="bg">등록부 밖</span>' : '') +
      '<span class="cdm">' + (g.mx ? '최장 ' + g.mx + 'Y · ' : '') +
        '딜 ' + g.d.length + '</span></div>' +
    '<div class="cdr2">' + (g.e ? esc(g.e) + ' · ' : '') +
      (g.pc ? '펀드 ' + g.pc + '개' + (g.amt ? ' · 약정 ' +
        (g.amt >= 10000 ? (g.amt/10000).toFixed(1) + '조' : g.amt.toLocaleString() + '억') : '')
        : '등록 펀드 없음') +
      (g.med ? ' · 회수 중앙값 ' + g.med + '년' : '') + '</div>';
  if(open){
    h += '<div class="cdx">';
    if(need.length){
      h += '<div class="cdsec">엑싯 필요 <em>보유 5년 이상 ' + need.length + '곳</em></div>' +
           holdLegend();
      for(const d of need) h += dealLine(d, true);
    }
    if(ex.length){
      h += '<div class="cdsec">회수 완료 <em>벤치마크' +
           (g.med ? ' · 중앙값 ' + g.med + '년' : '') + '</em></div>';
      for(const d of ex) h += dealLine(d);
    }
    if(g.f.length){
      h += '<div class="cdsec">펀드 <em>' + g.pc + '개</em></div>';
      for(const f of g.f.slice(0,12))
        h += '<div class="hz">' + esc(f[0]) + (f[1] ? ' · ' + f[1] : '') +
             (f[2] ? ' · ' + Number(f[2]).toLocaleString() + '억' : '') + '</div>';
      if(g.f.length > 12) h += '<div class="hz" style="color:var(--dim)">외 ' +
        (g.f.length-12) + '개</div>';
    }
    // JSON 파싱 후에는 need/exit 와 d 가 서로 다른 객체다. 키로 비교한다.
    const kk = x => x[0] + '|' + x[1] + '|' + x[4];
    const seen = new Set(need.map(kk).concat(ex.map(kk)));
    const rest = g.d.filter(x => !seen.has(kk(x)));
    if(rest.length){
      h += '<div class="cdsec">그 외 <em>' + rest.length + '건</em></div>';
      for(const d of rest) h += dealLine(d);
    }
    if(g.vn) h += '<div style="margin-top:8px"><a class="ab" href="' + obs(g.vn) +
      '">vault 노트 →</a></div>';
    h += '</div>';
  }
  return h + '</div>';
}

/* -- 예정 / 완료 -----------------------------------
   미래 일자로 담은 미팅을 컨택으로 세면 안 된다 — 아직 안 만났으니까.
   status 가 없는 과거 기록은 done 으로 본다. */
const isPlanned = l => l.status ? l.status === 'planned' : (l.date > todayStr());
const dDays = d => {                     // 오늘 기준 남은 일수 (음수면 지남)
  const t = dnum(d); if(!t) return null;
  const n = new Date();
  return Math.round((t - Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())) / DAY);
};
const doneLogs = () => LOGS.filter(l => !isPlanned(l));
const planLogs = () => LOGS.filter(isPlanned)
  .slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));


/* -- 미팅 목록 · 수정 · 삭제 ------------------------ */
let logSheet = null, logMore = false;

/* -- Cadence --------------------------------------
   컨택을 조직·인물로 집계하고 목표 주기를 넘긴 곳을 표시한다.
   고유 리듬은 추정하지 않는다 - 목표는 주 단위로 직접 정한다.       */
const DAY = 86400000;
const dnum = s => { const p = String(s||'').split('-');
  return p.length===3 ? Date.UTC(+p[0], +p[1]-1, +p[2]) : 0; };
const daysAgo = s => { const t = dnum(s); if(!t) return null;
  const n = new Date();
  return Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()) - t)/DAY); };
const defWk = () => (CAD.__default && CAD.__default.target_wk) || DEF_WK;
const cadOf = c => CAD[cadKey(c)] || {};
const targetWk = c => { const o = cadOf(c); return o.target_wk || defWk(); };

function cadAgg(){
  const m = {};
  const put = c => m[c] || (m[c] = {company:c, last:'', n:0, w:0,
                                    kinds:{}, people:{}, zone:'', hist:[]});
  for(const l of doneLogs()){
    const c = l.company || l.title; if(!c) continue;
    const o = put(c);
    const k = l.kind || 'meet';
    const w = (l.weight != null) ? l.weight : (KW[k] || 1);
    o.n++; o.w += w; o.kinds[k] = (o.kinds[k]||0) + 1;
    if(l.zone && !o.zone) o.zone = l.zone;
    if(!o.last || l.date > o.last) o.last = l.date;
    if(o.hist.length < 8) o.hist.push({d:l.date, k:k,
        p:(l.people||[]).join(', '), place:l.place||''});
    for(const nmp of (l.people||[])){
      const q = o.people[nmp] || (o.people[nmp] = {name:nmp, last:'', n:0});
      q.n++; if(!q.last || l.date > q.last) q.last = l.date;
    }
  }
  for(const k in CAD){ if(k !== '__default' && CAD[k].company) put(CAD[k].company); }
  // 예정이 잡혀 있으면 알려준다 — 컨택 필요는 그대로 두되 중복 연락을 막는다
  for(const l of planLogs()){
    const c = l.company || l.title; if(!c) continue;
    const o = put(c);
    if(!o.next || l.date < o.next) o.next = l.date;
  }
  const rows = Object.values(m).map(o => {
    const wk = targetWk(o.company), lim = wk * 7;
    const d = o.last ? daysAgo(o.last) : null;
    const st = d == null ? 'none' : (d > lim ? 'l' : (d > lim*0.8 ? 's' : 'o'));
    return Object.assign({}, o, {wk:wk, lim:lim, days:d, st:st,
      over:(d == null ? 9999 : d - lim), t1:(cadOf(o.company).tier === 'T1')});
  });
  rows.sort((a,b) => (b.t1 - a.t1) || (b.over - a.over));
  return rows;
}

const BGL = {l:'컨택 필요', s:'임박', o:'정상', none:'미컨택'};

function cadRow(r){
  const ratio = r.days == null ? null : r.days / r.lim;
  const o = inten(ratio, CAD_CUTS);
  const pct = r.days == null ? 100 : Math.min(100, Math.round(r.days / r.lim * 100));
  const kinds = Object.keys(r.kinds).map(k => KLBL[k] + ' ' + r.kinds[k]).join(' · ');
  const np = Object.keys(r.people).length;
  const open = cadOpen === r.company;
  const over = (r.days != null && r.days > r.lim) ? (r.days - r.lim) : 0;
  let h = '<div class="cdr' + (open ? ' op' : '') + '" data-cad="' + esc(r.company) + '">' +
    '<div class="cdr1">' + swatch(o) +
      (r.t1 ? '<span class="t1">T-1</span>' : '') +
      '<b>' + esc(r.company) + '</b>' +
      (r.next ? '<span class="pl n">예정 ' + r.next.slice(5).replace('-','.') + '</span>' : '') +
      '<span class="cdm">' + (r.days == null ? '기록 없음' : r.days + '일 전') + '</span></div>' +
    '<div class="cdr2">목표 ' + r.wk + '주' + (over ? ' · ' + over + '일 초과' : '') +
      (kinds ? ' · ' + kinds : '') + (np ? ' · 인물 ' + np + '명' : '') + '</div>' +
    '<div class="pb"><i style="width:' + pct + '%;opacity:' + (o || .3) + '"></i></div>';
  if(open){
    h += '<div class="cdx">';
    const ps = Object.values(r.people).sort((a,b) => dnum(b.last) - dnum(a.last));
    if(ps.length){
      h += '<div class="cdsec">인물 <em>' + ps.length + '명</em></div>';
      for(const p of ps){
        const pd = daysAgo(p.last);
        h += '<div class="pp">' + swatch(pd == null ? null : inten(pd / r.lim, CAD_CUTS)) +
             '<b>' + esc(p.name) + '</b>' +
             '<span class="cdm">' + (pd == null ? '-' : pd + '일') +
             ' · 컨택 ' + p.n + '</span></div>';
      }
    }
    if(r.hist.length){
      h += '<div class="cdsec">이력</div>';
      for(const e of r.hist)
        h += '<div class="hz">' + esc(e.d) + ' · ' + (KLBL[e.k] || e.k) +
             (e.place ? ' · ' + esc(e.place) : '') + (e.p ? ' · ' + esc(e.p) : '') + '</div>';
    }
    h += '<div style="margin-top:8px">' +
      '<button class="chip on" data-cq="' + esc(r.company) + '">컨택 담기</button> ' +
      '<button class="chip" data-cs="' + esc(r.company) + '">팔로업 설정</button> ' +
      '<button class="chip" data-cr="' + esc(r.company) + '">이름 수정</button></div></div>';
  }
  return h + '</div>';
}

/* ── 인물 ──────────────────────────────────────
   명함(person)은 사람의 속성만 들고, 컨택 횟수·최근일은 로그에서 계산한다.
   이력을 명함에 적게 두면 두 벌이 생기고 반드시 어긋난다. */
const perOf = n => { const k = perKey(n); return (k && PER[k]) || {}; };

/* ── 명함 ──────────────────────────────────────
   사진이 본체다. 파싱값이 틀려도 원본을 다시 볼 수 있어야 아카이브가 된다. */
const CARD_MAX = 1600;        // 긴 변. 읽기에도 사람이 다시 보기에도 이만하면 된다.

/* 폰 원본은 장당 3~5MB 다. 10년이면 15GB — 무료 한도를 넘는다.
   1600px / JPEG 0.82 면 장당 300KB 안팎이고 글자는 또렷하게 남는다. */
function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, CARD_MAX / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * s));
      const h = Math.max(1, Math.round(img.height * s));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({blob:b, w:w, h:h}) : rej(new Error('변환 실패')),
               'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했습니다')); };
    img.src = url;
  });
}

/* 저장 — 명함 이미지를 사람에 붙이고, 빈 칸만 파싱값으로 채운다.
   적어 둔 값을 덮지 않는다. 사람이 아직 안 본 값에는 unverified 를 단다. */
async function saveCard(qid, nm){
  const q = QUEUE.find(x => x.id === qid);
  if(!q) throw new Error('큐에서 찾지 못했습니다');
  nm = (nm || '').trim();
  if(!nm) throw new Error('이름이 비어 있습니다');
  const p = q.parsed || {};
  const cur = perOf(nm), o = {};
  for(const k of ['org','role','phone','mail'])
    if(!cur[k] && p[k]) o[k] = p[k];
  const have = (cur.cards || []).map(c => c.path);
  if(have.indexOf(q.path) < 0)
    o.cards = (cur.cards || []).concat([{url:q.img, path:q.path, at:todayStr()}]);
  if(Object.keys(o).some(k => k !== 'cards')) o.unverified = true;
  await savePer(nm, o);
  await updateDoc(doc(db,'users',USER.uid,'orig_inbox',qid), {status:'saved', saved_as:nm});
}

function perAgg(withDel){
  const m = {};
  const put0 = n => m[n] || (m[n] = {name:n, last:'', n:0, w:0,
                                    kinds:{}, orgs:{}, hist:[]});
  const put = n => put0(perCanon(n));     // 합쳐진 명함의 이름은 남은 쪽으로 센다
  for(const l of doneLogs()){
    const c = l.company || l.title;
    for(const nm of (l.people || [])){
      const o = put(nm);
      const k = l.kind || 'meet';
      o.n++; o.w += (l.weight != null) ? l.weight : (KW[k] || 1);
      o.kinds[k] = (o.kinds[k] || 0) + 1;
      if(c) o.orgs[c] = (o.orgs[c] || 0) + 1;
      if(!o.last || l.date > o.last) o.last = l.date;
      if(o.hist.length < 8) o.hist.push({d:l.date, k:k, c:c || '', place:l.place || ''});
    }
  }
  // 명함만 만들어 두고 아직 만난 적 없는 사람도 목록에 올린다
  for(const k in PER){ if(PER[k].name && !PER[k].merged_into && (withDel || !PER[k].deleted)) put(PER[k].name); }
  for(const l of planLogs()){
    for(const nm of (l.people || [])){
      const o = put(nm);
      if(!o.next || l.date < o.next) o.next = l.date;
    }
  }
  return Object.values(m).filter(o => withDel || !perOf(o.name).deleted).map(o => {
    const p = perOf(o.name);
    const wk = p.target_wk || defWk(), lim = wk * 7;
    const d = o.last ? daysAgo(o.last) : null;
    const st = d == null ? 'none' : (d > lim ? 'l' : (d > lim * 0.8 ? 's' : 'o'));
    // 소속은 기록에서 가장 잦은 곳. 명함에 적어 두면 그쪽이 이긴다 — 회사를 옮기면 그래야 한다.
    const byLog = Object.keys(o.orgs).sort((a,b) => o.orgs[b] - o.orgs[a]);
    return Object.assign({}, o, {card:p, org:(p.org || byLog[0] || ''),
      prev:(p.org && byLog[0] && p.org !== byLog[0]) ? byLog[0] : '',
      wk:wk, lim:lim, days:d, st:(p.tier === 'off' ? 'off' : st), off:(p.tier === 'off'), del:!!p.deleted, delAt:p.deleted_at || '',
      over:(d == null ? 9999 : d - lim), t1:(p.tier === 'T1')});
  }).sort((a,b) => (b.t1 - a.t1) || (a.off - b.off) || (b.over - a.over));
}

/* 직급어. 긴 것부터 본다 — '대표이사' 를 '대표'/'이사' 로 먼저 끊으면 안 된다.
   공백으로 끊긴 마지막 토큰이 여기 들면 직급으로 본다. 붙여 쓴 '김이사' 는 건드리지 않는다. */
const ROLE_WORDS = ['대표이사','전무이사','상무이사','부회장','회장','사장','부사장',
  '전무','상무','본부장','센터장','그룹장','파트장','팀장','실장','부장','차장','과장',
  '대리','주임','사원','이사','파트너','심사역','수석','책임','선임','위원','고문',
  '교수','변호사','회계사','세무사','대표','부대표','소장','원장','총괄','연구원','연구위원','애널리스트','매니저','이사대우','상무보','전무보'];

function splitRole(s){
  const m = String(s || '').trim().match(/^(.+?)\s+(\S+)$/);
  if(!m) return null;
  const base = m[1].trim(), w = m[2].trim();
  if(ROLE_WORDS.indexOf(w) < 0) return null;
  if(base.length < 2) return null;     // '김 상무' 는 이름으로 보기 어렵다
  return {name: base, role: w};
}

// 로그에 남은 '이름+직급' 후보. 기록 건수까지 세어 무게를 보여 준다.
function roleCandidates(){
  const cnt = {};
  for(const l of LOGS)
    for(const nm of (l.people || [])) cnt[nm] = (cnt[nm] || 0) + 1;
  const out = [];
  for(const nm in cnt){
    const sp = splitRole(nm);
    if(sp) out.push({from:nm, to:sp.name, role:sp.role, n:cnt[nm]});
  }
  return out.sort((a,b) => b.n - a.n);
}

/* 적용 — 로그의 people 을 새 이름으로 바꾸고 직급은 명함에 넣는다.
   옛 명함 문서는 지우지 않는다. merged_into 를 찍어 목록에서만 뺀다 —
   사용자가 적어 둔 메모·연락처를 말없이 날리지 않기 위해서다. */
async function applyRoleSplit(c){
  if(!USER) { needLogin(); return; }
  const old = perOf(c.from), cur = perOf(c.to);
  const o = {};
  for(const k of ['org','phone','mail','memo','tags'])
    if(!cur[k] && old[k]) o[k] = old[k];        // 옛 명함의 값을 끌어온다
  if(!cur.role) o.role = c.role;                // 이미 적어 둔 직급은 덮지 않는다
  if(!cur.target_wk && old.target_wk) o.target_wk = old.target_wk;
  if(!cur.tier && old.tier) o.tier = old.tier;
  await savePer(c.to, o);
  if(old.name) await savePer(c.from, {merged_into: c.to});
  for(const l of LOGS){
    if((l.people || []).indexOf(c.from) < 0) continue;
    const seen = {}, next = [];
    for(const x of l.people){
      const y = (x === c.from) ? c.to : x;
      if(!seen[y]) { seen[y] = 1; next.push(y); }   // 이미 새 이름이 있으면 중복 제거
    }
    await updLog(l.id, {people: next});
  }
}

/* 보여 줄 때만 쓰는 분리. 데이터는 안 건드린다 — 키는 여전히 원래 이름이다.
   명함에 적어 둔 직책이 있으면 그 값이 이긴다(승진하면 거기만 고치면 된다). */
function nameView(nm){
  const sp = splitRole(nm);
  const role = perOf(nm).role || (sp ? sp.role : '');
  return {base: sp ? sp.name : nm, role: role};
}

/* 인물 일괄 동작. off/on = 추적, del = 휴지통(표시만), restore = 복구, purge = 문서 삭제.
   취소하면 false. Field Notes 기록은 어느 동작도 건드리지 않는다. */
async function perAct(names, act){
  const who = names.length === 1 ? names[0] : names.length + '명';
  if(act === 'del' && !confirm(who + ' 을(를) 삭제합니다. 휴지통에서 복구할 수 있습니다.')) return false;
  if(act === 'purge' && !confirm(who + ' 의 명함 문서를 완전히 지웁니다. 되돌릴 수 없습니다. 기록은 남습니다.')) return false;
  const one = async nm => {
    if(act === 'purge'){
      const k = perKey(nm); if(!k) return;
      return deleteDoc(doc(db,'users',USER.uid, PCOL === 'person2' ? 'person2' : 'person', k));
    }
    const o = act === 'off' ? {tier:'off'} : act === 'on' ? {tier:null}
          : act === 'del' ? {deleted:true, deleted_at:todayStr()} : {deleted:false, deleted_at:''};
    return savePer(nm, o);
  };
  for(let i = 0; i < names.length; i += 20) await Promise.all(names.slice(i, i + 20).map(one));
  return true;
}

// 이름 → 남아 있는 명함의 이름. 합쳐진 명함(merged_into)은 그 끝을 따라간다
function perCanon(n){
  let k = perKey(n), p = k && PER[k], hop = 0;
  while(p && p.merged_into && hop++ < 4){
    const q = PER[p.merged_into] || PER[perKey(p.merged_into)];
    if(!q || q === p) break;
    p = q;
  }
  return (p && p.name && !p.merged_into) ? p.name : n;
}
function mgList(){

  const sameOrg = r => (me.org && r.org && orgLike(me.org, r.org)) ? 1 : 0;
  rows.sort((a, b) => (sameOrg(b) - sameOrg(a)) || (b.n - a.n) || a.name.localeCompare(b.name));
  if(!rows.length) return '<div class="empty">없습니다.</div>';

const perColName = () => (PCOL === 'person2' ? 'person2' : 'person');
const perKeyOrNew = (n, org) => perKey(n) || (PCOL === 'person2' ? mkKey(n, org || '') : cadKey(n));
async function doMerge(from, to){
  if(!USER) throw new Error('로그인이 필요합니다');
  const fk = perKey(from), tk = perKey(to);
  const A = (fk && PER[fk]) || {name: from}, B = (tk && PER[tk]) || {};
  const o = {};
  for(const k of ['org','role','dept','phone','mail','tel','url','target_wk','tier'])
    if(!B[k] && A[k]) o[k] = A[k];
  if(A.memo) o.memo = B.memo ? (B.memo + '\n' + A.memo) : A.memo;
  if(A.tags){
    const s = {}; String((B.tags || '') + ',' + A.tags).split(',').map(x => x.trim()).filter(Boolean).forEach(x => { s[x] = 1; });
    o.tags = Object.keys(s).join(', ');
  }
  const al = {}; (B.aliases || []).concat(A.aliases || [], [from]).forEach(a => { if(a && a !== to) al[a] = 1; });
  o.aliases = Object.keys(al);
  const orgs = (B.orgs || []).slice();
  (A.orgs || []).concat(A.org ? [{org:A.org, from:'', src:'merge'}] : []).forEach(x => { if(x.org && !orgs.some(y => y.org === x.org)) orgs.push(x); });
  if(orgs.length) o.orgs = orgs;
  if(A.cards && A.cards.length) o.cards = (B.cards || []).concat(A.cards);
  if(A.imports && A.imports.length){ const s = {}; (B.imports || []).concat(A.imports).forEach(x => { s[x] = 1; }); o.imports = Object.keys(s); }
  o.merged_from = (B.merged_from || []).concat([from]);
  o.touched = new Date().toISOString();
  const src = {};
  for(const k in o) if(A.src && A.src[k] && o[k] === A[k]) src[k] = A.src[k];
  const key = tk || perKeyOrNew(to, o.org);
  const body = Object.assign({name: to}, o); if(Object.keys(src).length) body.src = src;
  const col = perColName();
  await setDoc(doc(db,'users',USER.uid,col,key), body, {merge:true});
  await setDoc(doc(db,'users',USER.uid,col, fk || perKeyOrNew(from, '')), {name: from, merged_into: key, touched: o.touched}, {merge:true});
}

          '<button class="chip" data-pdel="del" data-nm="' + esc(r.name) + '">삭제</button>') + '</div></div>' +
      (c.merged_from || []).map(f => '<div class="hz">합쳐진 명함 · ' + esc(f) +
        ' <button class="chip" style="padding:2px 8px;font-size:10px" data-mgsplit="' + esc(f) + '" data-nm="' + esc(r.name) + '">분리</button></div>').join('');
    if(r.hist.length){
      h += '<div class="cdsec">이력</div>';

             (e.c ? ' · ' + esc(e.c) : '') + (e.place ? ' · ' + esc(e.place) : '') + '</div>';
    }
    h += '</div>';

  return h + '</div>';
}

   리멤버·LinkedIn 은 person_import(staging) 에 머물고, 승인한 것만 person2 에 쓴다.

const calRef = id => doc(db,'users',USER.uid,'cal_import',id);
const ymd = s => String(s || '').slice(0, 10);
const fmtPhone = s => { const d = String(s || '').replace(/\D/g, '');
  if(d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
  if(d.length === 10) return d.replace(/(\d{2,3})(\d{3,4})(\d{4})/, '$1-$2-$3');
  return s || ''; };
const srcTag = s => '<span class="srcx ' + (s === 'remember' ? 'rm">RM' : 'li">LI') + '</span>';

const rvB = () => rvLinks().filter(L => L.grade === 'B' && rvCands(L).length === 1);
const rvC = () => rvLinks().filter(L => !(L.grade === 'B' && rvCands(L).length === 1));
const rvPicked = L => { const cs = rvCands(L); return cs.length === 1 ? cs : cs.filter(R => rvSel[L.id] && rvSel[L.id][R.id]); };
// 표기만 다른 같은 회사인지 — 한쪽 슬러그가 다른 쪽을 품으면 같다고 본다

async function setImp(r, o){ Object.assign(r, o); await setDoc(impRef(r.id), o, {merge:true}); }

// person2 안에서 이름(별칭 포함)으로 키 찾기. 스위치가 아직 person 이어도 쓰기는 person2 로 간다.
function per2Key(n){
  n = String(n || '').trim(); let f = null;
  for(const k in PER2){ const p = PER2[k];
    if(p.name === n || (p.aliases || []).indexOf(n) >= 0){ if(!p.merged_into) return k; f = f || k; } }
  return f;
}

/* 빈 칸만 채운다. 값이 있으면 출처 순위가 낮을 때만 덮는다 — 직접 입력은 아무도 못 덮는다. */
function fillFrom(cur, row, from, fields, newer){
  const o = {}, s = {};
  for(const k of fields){
    const v = String(row[k] == null ? '' : row[k]).trim();
    if(!v) continue;
    const have = cur[k];
    const curFrom = (cur.src && cur.src[k] && cur.src[k].from) || (have ? 'manual' : '');
    if(have){
      if(curFrom === 'manual' || !RANK[curFrom]) continue;          // 직접 입력은 아무도 못 덮는다
      if(!newer && RANK[curFrom] >= RANK[from]) continue;          // 이직이 아니면 출처 순위
    }
    o[k] = v; s[k] = {v:v, from:from, at:asofOf(row) || todayStr()};
  }
  if(Object.keys(s).length) o.src = s;
  return o;
}

/* 한 사람 반영 계획. R=리멤버 행, L=LinkedIn 행 — 하나는 있어야 한다.
   쓰기는 ops 에 쌓고, 바뀌는 칸의 옛값은 chg 에 남겨 되돌릴 수 있게 한다. */
function planPerson(R, L, ops, chg, opt){
  opt = opt || {};
  const move = opt.mode === 'move';
  // 리멤버 행은 최신 명함이 앞. 같은 회사 모드에선 앞 행이 소속·직책을 정한다
  const Rs = [R].concat(opt.more || []).filter(Boolean).sort((x, y) => asofOf(x) > asofOf(y) ? -1 : 1);
  const all = Rs.concat(L ? [L] : []);
  const base = Rs[0] || L;
  const nm = String(base.name || '').trim();
  let key = all.map(r => r.person_key || r.target).filter(Boolean)[0] || per2Key(nm);
  if(key && !PER2[key]) key = null;
  const isNew = !key;
  if(isNew) key = mkKey(nm, base.org || '');
  const cur = isNew ? {} : PER2[key];
  const o = isNew ? {name:nm, created:todayStr(), memo:'', tags:''} : {};
  const view = () => Object.assign({}, cur, o, {src: Object.assign({}, cur.src || {}, o.src || {})});
  const merge = (row, from, fields) => {
    if(!row) return;
    const f = fillFrom(view(), row, from, fields, move);
    const src = Object.assign({}, o.src || {}, f.src || {});
    Object.assign(o, f);
    if(Object.keys(src).length) o.src = src;
    const al = {};
    (cur.aliases || []).concat(o.aliases || [], row.aliases || []).forEach(a => { if(a) al[a] = 1; });
    if(row.name && row.name !== nm) al[row.name] = 1;
    o.aliases = Object.keys(al);
    const orgs = (o.orgs || cur.orgs || []).slice();
    if(row.org && !orgs.some(x => x.org === row.org))
      orgs.push({org:row.org, from: from === 'linkedin' ? '' : ymd(row.date), seen: asofOf(row), src:from});
    o.orgs = orgs;
    const im = {};
    (cur.imports || []).concat(o.imports || [], [row.id]).forEach(x => { im[x] = 1; });
    o.imports = Object.keys(im);
    row.person_key = key;
  };
  const FR = ['org','role','dept','phone','mail','tel'], FL = ['org','role','url'];
  const fieldsOf = r => (r.src === 'linkedin' ? FL : FR), fromOf = r => (r.src === 'linkedin' ? 'linkedin' : 'remember');
  if(move){
    // 이직: 날짜 오름차순으로 넣어 가장 최신 출처가 소속·직책을 정한다. 옛 소속은 orgs[] 에 남는다
    all.slice().sort((x, y) => asofOf(x) < asofOf(y) ? -1 : 1).forEach(r => merge(r, fromOf(r), fieldsOf(r)));
  }else{
    Rs.forEach(r => merge(r, 'remember', FR));
    merge(L, 'linkedin', FL);
  }
  if(cur.deleted){ o.deleted = false; o.deleted_at = ''; }
  o.touched = new Date().toISOString();
  const before = {};
  if(!isNew) for(const k in o) before[k] = (cur[k] === undefined) ? null : cur[k];
  ops.push({ref: doc(db,'users',USER.uid,'person2',key), data:o, merge:true});
  chg.push({col:'person2', id:key, before: isNew ? null : before});
  PER2[key] = Object.assign({}, cur, o);      // 같은 승인 안에서 같은 사람이 또 나오면 이 키를 쓴다
  return key;
}

async function flushOps(ops){
  const by = {}, order = [];
  for(const op of ops){
    const p = op.ref.path;
    if(!by[p]){ by[p] = op; order.push(p); }
    else if(op.del){ by[p] = op; }
    else { Object.assign(by[p].data, op.data); }
  }
  for(let i = 0; i < order.length; i += 400){
    const b = writeBatch(db);
    for(const p of order.slice(i, i + 400)){
      const op = by[p];
      if(op.del) b.delete(op.ref); else b.set(op.ref, op.data, {merge: !!op.merge});
    }
    await b.commit();
  }
}

async function commitBatch(kind, label, rows, ops, chg){
  const bid = 'b' + Date.now(), at = new Date().toISOString();
  for(const r of rows)
    ops.push({ref: impRef(r.id), data:{status:'approved', batch:bid, person_key:r.person_key || ''}, merge:true});
  const rec = {at:at, kind:kind, label:label, n:rows.length, imports:rows.map(r => r.id), changes:chg};
  ops.push({ref: doc(db,'users',USER.uid,'person_batch',bid), data:rec});
  await flushOps(ops);
  for(const r of rows){ r.status = 'approved'; r.batch = bid; }
  BATCH.unshift(Object.assign({id:bid}, rec));
}

const orgAliasOp = (L, R) => (L.why && L.why.indexOf('회사') < 0 && R.org && L.org && R.org !== L.org)
  ? [{ref: doc(collection(db,'users',USER.uid,'org_alias')), data:{a:R.org, b:L.org, at:todayStr(), by:'review'}}] : [];

// 다른 사람 — LinkedIn 행은 신규로, 숨겨 둔 리멤버 후보도 신규로 돌아간다
async function unlinkRow(L){
  const ops = [];
  for(const R of rvCands(L))
    if(R.kind === 'linked'){ R.kind = 'new'; ops.push({ref: impRef(R.id), data:{kind:'new'}, merge:true}); }
  L.kind = 'new'; L.link_to = ''; L.cands = [];
  ops.push({ref: impRef(L.id), data:{kind:'new', link_to:'', cands:[], unlinked:true}, merge:true});

}
function releaseOthers(L, keep, ops){
  for(const x of rvCands(L))
    if(keep.indexOf(x) < 0 && x.kind === 'linked'){ x.kind = 'new'; ops.push({ref: impRef(x.id), data:{kind:'new'}, merge:true}); }
}
// Rs: 고른 리멤버 행들. mode 'same' = 표기만 다른 같은 회사(별칭 학습), 'move' = 이직(학습 없음, 최신이 현재 소속)
async function approveLink(L, Rs, mode){
  Rs = [].concat(Rs); mode = mode || 'same';
  const ops = [], chg = [];
  planPerson(Rs[0], L, ops, chg, {mode:mode, more:Rs.slice(1)});
  releaseOthers(L, Rs, ops);
  if(mode === 'same') for(const R of Rs) ops.push(...orgAliasOp(L, R));
  const names = Rs.map(r => r.name + ' (' + (r.org || '-') + ')').join(', ');
  await commitBatch('link', L.name + ' = ' + names + (mode === 'move' ? ' · 이직' : ''), [L].concat(Rs), ops, chg);
  delete rvSel[L.id];
}
async function approveLinkAll(){
  const ops = [], chg = [], rows = [];
  for(const L of rvB()){
    const R = rvCands(L)[0];
    planPerson(R, L, ops, chg); rows.push(L, R);
    ops.push(...orgAliasOp(L, R));
  }
  if(!rows.length) return;
  await commitBatch('link-all', '연결 ' + (rows.length / 2) + '쌍 (회사·메일 근거)', rows, ops, chg);
}
async function approveRows(rows, kind, label){
  const ops = [], chg = [], done = [];
  for(const r of rows){
    if(r.status !== 'open') continue;
    // 리멤버 행에 근거 있는(B) LinkedIn 쌍이 붙어 있으면 같이 들어간다
    const L = (r.src === 'remember')
      ? impOpen().find(x => x.kind === 'link' && x.grade === 'B' && x.link_to === r.id && rvCands(x).length === 1) : null;
    planPerson(r.src === 'remember' ? r : null, r.src === 'remember' ? L : r, ops, chg);
    done.push(r); if(L) done.push(L);
  }
  if(!done.length) return 0;
  await commitBatch(kind, label, done, ops, chg);
  return done.length;
}
async function undoBatch(b){
  const ops = []; let skipped = 0;
  for(const c of (b.changes || [])){
    const cur = PER2[c.id];
    if(cur && cur.touched && cur.touched > b.at){ skipped++; continue; }   // 그 뒤 직접 고쳤다
    const ref = doc(db,'users',USER.uid,c.col,c.id);
    if(c.before === null){ ops.push({ref:ref, del:true}); continue; }
    const data = {};
    for(const k in c.before) data[k] = (c.before[k] === null) ? deleteField() : c.before[k];
    ops.push({ref:ref, data:data, merge:true});
  }
  for(const id of (b.imports || [])){
    ops.push({ref: impRef(id), data:{status:'open', batch:'', person_key:''}, merge:true});
    const r = impById(id); if(r){ r.status = 'open'; r.batch = ''; r.person_key = ''; }
  }
  for(const id of (b.cal || [])){
    ops.push({ref: calRef(id), data:{status:'open', log:'', batch:''}, merge:true});
    const r = calById(id); if(r){ r.status = 'open'; r.log = ''; }
  }
  if(b.kind === 'fix' && b.alias){ OAL = OAL.filter(x => x.id !== b.alias); }
  ops.push({ref: doc(db,'users',USER.uid,'person_batch',b.id), data:{undone:new Date().toISOString(), skipped:skipped}, merge:true});
  await flushOps(ops);
  b.undone = true; b.skipped = skipped;
  return skipped;
}

function rvCalView(){

function fixRows(){
  if(!ENT || !LOGS) return [];
  const names = {}; ENT.items.forEach(x => { names[x.n] = 1; });
  const al = {}; OAL.forEach(x => { if(x.a) al[x.a] = x.b; });
  const m = {};
  for(const l of LOGS){
    const c = l.company || ''; if(!c || names[c] || al[c]) continue;
    (m[c] = m[c] || {raw:c, n:0, ids:[]}); m[c].n++; m[c].ids.push(l.id);
  }
  return Object.values(m).sort((a, b) => b.n - a.n);
}
function fixSug(raw){
  const f = s => String(s || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^0-9a-z가-힣]/g, '');
  const q = f(raw); if(q.length < 2) return [];
  const out = [];
  for(const x of ENT.items){
    const n = f(x.n), en = f((x.n.match(/\(([^)]+)\)/) || [])[1] || '');
    if(n === q || (en && en === q)) out.unshift(x.n);
    else if((q.length >= 3 && (n.indexOf(q) >= 0 || (en && en.indexOf(q) >= 0))) || (n.length >= 3 && q.indexOf(n) >= 0)) out.push(x.n);
  }
  return out.slice(0, 4);
}
