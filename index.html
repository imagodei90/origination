async function renameCompany(from, canon){
  const ids = LOGS.filter(l => (l.company || '') === from).map(l => l.id);
  const ops = [], chg = [];
  const isEnt = n => !!(ENT && ENT.items.some(x => x.n === n));
  if(canon !== from){
    for(const id of ids){
      const l = LOGS.find(x => x.id === id) || {};
      ops.push({ref: logRef(id), data:{company:canon, title:(l.title === from || !l.title) ? canon : l.title, company_raw:from}, merge:true});
      chg.push({col:'field_notes', id:id, before:{company:from, title:(l.title || from), company_raw:(l.company_raw === undefined ? null : l.company_raw)}});
    }
    const ok = cadKey(from), nk = cadKey(canon), oc = CAD[ok];
    if(oc && !CAD[nk]){
      const cp = Object.assign({}, oc, {company:canon, renamed_from:from});
      ops.push({ref: doc(db,'users',USER.uid,'cadence',nk), data:cp, merge:true});
      chg.push({col:'cadence', id:nk, before:null});
    }
  }
  let aliasId = '';
  if(canon === from || isEnt(canon)){
    const ar = doc(collection(db,'users',USER.uid,'org_alias'));
    ops.push({ref: ar, data:{a:from, b:canon, at:todayStr(), by:(canon === from ? 'keep' : 'rename')}});
    chg.push({col:'org_alias', id:ar.id, before:null});
    aliasId = ar.id;
  }
  const bid = 'b' + Date.now(), at = new Date().toISOString();
  const rec = {at:at, kind:'fix', label:'상대 ' + from + (canon === from ? ' 그대로' : ' → ' + canon), n:ids.length, imports:[], alias:aliasId, changes:chg};
  ops.push({ref: doc(db,'users',USER.uid,'person_batch',bid), data:rec});
  await flushOps(ops);
  if(aliasId) OAL.push({id:aliasId, a:from, b:canon});
  BATCH.unshift(Object.assign({id:bid}, rec));
}

    const on = r.status === 'open' && !rvOff[r.id];
    return '<div class="rvrow' + (on ? '' : ' off') + '">' +
      '<div class="ck' + (on ? ' on' : '') + '" data-rvck="' + esc(r.id) + '"></div>' +
      '<div class="b" data-rvx="' + esc(r.id) + '"><div class="nm">' + esc(r.name) + ' ' + srcTag(r.src) +
      (r.fn ? '<span class="srcx">기록 ' + r.fn + '</span>' : '') +
      (r.status === 'hold' ? '<span class="srcx">' + esc(r.hold_why || '보류') + '</span>' : '') + '</div>' +
      '<div class="o">' + esc(r.org || '-') + (r.dept ? ' · ' + esc(r.dept) : '') + ' · ' + esc(r.role || '-') + '</div></div>' +
      '<div class="d">' + (r.ent ? '<span class="ent">상대조직</span><br>' : '') + esc(ymd(r.date)) + '</div>' +
      (rvOpen === r.id ? rvDetail(r) : '') + '</div>';
  }).join('') + '</div>';
  if(rows.length > rvMore)
    h += '<button class="btn" id="rv-more" style="width:100%;margin-top:4px">더 보기 (' + (rows.length - rvMore).toLocaleString() + ')</button>';
  return h + rvBar('<b>' + sel.length.toLocaleString() + '</b> 선택 · ' + (rows.length - sel.length) + ' 보류',
    sel.length ? '<button class="btn p" id="rv-new-ok">선택 승인</button>' : '');
}

// 신규 행 상세 — 체크할지 판단할 근거를 다 보여 준다
function rvDetail(r){

  let g = '';
  if(li){
    g += kv('회사', esc(r.org)) + kv('직함', esc(r.role)) + kv('메일', esc(r.mail)) + kv('연결일', esc(ymd(r.date))) +
         kv('프로필', r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
                             esc(String(r.url).replace(/^https?:\/\/(www\.)?/, '')) + '</a>' : '');
  }else{
    g += kv('회사', esc(r.org)) + kv('부서', esc(r.dept)) +
         kv('직책', esc([r.role].concat(r.role_extra || []).filter(Boolean).join(' · '))) +
         kv('휴대폰', esc(r.phone ? fmtPhone(r.phone) : '')) + kv('직통', esc(r.tel)) + kv('팩스', esc(r.fax)) +
         kv('메일', esc(r.mail)) + kv('주소', esc(r.addr)) + kv('메모', esc(r.note)) + kv('명함 등록', esc(ymd(r.date))) +
         kv('원본 이름', (r.name_raw && r.name_raw !== r.name) ? esc(r.name_raw) : '');

  g += kv('같은 회사 등록', same.length ? esc(same.slice(0, 4).join(', ')) + (same.length > 4 ? ' 외 ' + (same.length - 4) + '명' : '') : '');
  if(r.fn) g += kv('Field Notes', '기록 ' + r.fn + '건' + (r.fn_org ? ' · ' + esc(r.fn_org) : ''));
  return '<div class="rvdet"><div class="kv">' + g + '</div>' +
    '<div class="act"><button class="btn xs" data-rved="' + esc(r.id) + '">고치기</button>' +
    (r.status === 'hold' ? '<button class="btn xs" data-rvunhold="' + esc(r.id) + '">보류 해제</button>'
                         : '<button class="btn xs" data-rvhold="' + esc(r.id) + '">보류</button>') + '</div></div>';

function rvUpdView(){
  const rows = rvUpds();
  if(!rows.length) return '<div class="empty">채울 것이 없습니다.</div>';
  let h = '<div class="cnt" style="margin:0 0 8px">이미 기록에 있던 사람입니다. 빈 칸만 채우고, 직접 적은 값은 건드리지 않습니다.</div>';
  let nfill = 0;
  const F = [['org','회사'],['role','직책'],['dept','부서'],['phone','휴대폰'],['mail','메일'],['url','LinkedIn']];
  for(const R of rows){
    const key = (R.target && PER2[R.target]) ? R.target : per2Key(R.name);
    const cur = (key && PER2[key]) || {};
    const L = impOpen().find(x => x.kind === 'link' && x.grade === 'B' && x.link_to === R.id);
    let g = '<div class="h"></div><div class="h">지금</div><div class="h">들어올 값</div>';
    for(const f of F){
      const li = R.src === 'linkedin';
      const k = f[0], from = (li || k === 'url') ? 'linkedin' : 'remember';
      const v = String(((k === 'url' && !li) ? (L || {}) : R)[k] || '').trim();
      const have = cur[k];
      if(!v && !have) continue;
      const curFrom = (cur.src && cur.src[k] && cur.src[k].from) || (have ? 'manual' : '');
      const keep = have && (RANK[curFrom] || 4) >= RANK[from];
      if(v && !keep) nfill++;
      g += '<div class="k">' + f[1] + '</div>' +
        '<div class="cur' + (have ? '' : ' e') + '">' + (have ? esc(k === 'phone' ? fmtPhone(have) : have) : '비어 있음') + '</div>' +
        '<div class="new' + (keep ? ' keep' : '') + '">' + (v ? esc(k === 'phone' ? fmtPhone(v) : v) +
          '<span>' + (from === 'linkedin' ? 'LI' : 'RM') + '</span>' : '') + '</div>';
    }
    h += '<div class="upd"><div class="nm">' + esc(R.name) + '<span class="rl">' + esc(cur.role || R.role || '') + '</span>' +
      '<span class="lnk">' + (key ? '명함 있음' : '기록 ' + (R.fn || '') + '건') + (L ? ' + LI' : '') + '</span></div>' +
      '<div class="fld">' + g + '</div>' +
      '<div class="act" style="display:flex;gap:5px;margin-top:9px">' +
      '<button class="btn xs p" data-rvupd="' + esc(R.id) + '">채움</button>' +
      '<button class="btn xs" data-rvhold="' + esc(R.id) + '">보류</button></div></div>';
  }
  h += '<div class="rvhint">직접 입력 &gt; 명함 &gt; 리멤버 &gt; LinkedIn. 줄 그어진 값은 들어오지 않습니다.</div>';
  return h + rvBar('<b>' + rows.length + '명</b> · 채울 칸 ' + nfill,
    '<button class="btn p" id="rv-upd-all">모두 채움</button>');
}

let cadView = 'org';
let cadFilt = 'over';

/* 찍기 · 대기 · 검토. 몰아서 넣는 게 주 용도라 목록에서 일괄 처리한다. */
function cardBlock(){
  const q = cardQ();
  const wait = q.filter(x => x.status === 'pending' || x.status === 'running');
  const rv   = q.filter(x => x.status === 'done' && x.parsed);
  const err  = q.filter(x => x.status === 'error');

  let h = '<div class="card" style="margin-bottom:10px">' +
    '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px">' +
      '<span style="font-size:11.5px;font-weight:600">명함</span>' +
      '<span style="flex:1"></span>' +
      (cardBusy ? '<span class="cnt" style="margin:0">' + esc(cardBusy) + '</span>' :
        '<button class="chip" id="cd-shoot">명함 찍기</button>') +
    '</div>' +
    '<input id="cd-file" type="file" accept="image/*" capture="environment" multiple ' +
      'style="display:none">';

  if(!q.length && !cardBusy)
    h += '<label class="cdrop" for="cd-file"><b>CARD</b>' +
         '탭해서 촬영 · 여러 장 연속으로<br>' +
         '<span style="font-size:10.5px;color:var(--dim)">사진은 그대로 보관됩니다 — ' +
         '읽은 값이 틀려도 원본을 다시 볼 수 있습니다</span></label>';

  if(wait.length || err.length){
    h += '<div class="cshots">' +
      wait.concat(err).map(x =>
        '<div class="cshot"><img src="' + esc(x.img || '') + '" alt="">' +
        '<span class="tag' + (x.status === 'error' ? ' e' : '') + '">' +
        (x.status === 'error' ? '오류' : '읽는 중') + '</span></div>').join('') +
      '</div>' +
      '<div class="cnt" style="margin:8px 0 0">PC 가 읽으면 아래 검토 목록에 뜹니다. ' +
      'PC 가 꺼져 있어도 <b>사진은 사라지지 않습니다</b>.</div>';
  }

  if(rv.length){
    // 같은 이름이 이미 있으면 알려 준다 — 동명이인은 조용히 합쳐지면 안 된다.
    const known = {};
    for(const r of perAgg()) known[r.name] = r.org || '';
    h += '<div class="cdsec">검토 대기 <em>' + rv.length + '장 — 이름만 확인하면 됩니다</em></div>';
    for(const x of rv){
      const p = x.parsed || {};
      const nm = (p.name || '').trim();
      const dup = nm && known[nm] !== undefined && known[nm] !== (p.org || '');
      const bits = [p.org, p.role, p.phone, p.mail].filter(Boolean).map(esc);
      h += '<div class="rvc" data-cq="' + esc(x.id) + '">' +
        '<div class="rvtop">' +
          '<img class="cardimg th" src="' + esc(x.img || '') + '" alt="" data-cbig="' + esc(x.img || '') + '">' +
          '<div class="rvb"><div class="nmrow"><span class="lb">이름</span>' +
            '<input class="nmin" data-cnm="' + esc(x.id) + '" value="' + esc(nm) + '">' +
            (!nm ? '<span class="rvw">못 읽음 — 사진을 보고 적어주세요</span>' : '') +
            (dup ? '<span class="rvw">같은 이름 있음 · ' + esc(known[nm] || '소속 미상') + '</span>' : '') +
          '</div>' +
          (bits.length ? '<div class="rvm"><b>' + bits.join('</b> · ') + '</div>' : '') +
          (p.note ? '<div class="rvm" style="margin-top:3px">' + esc(p.note) + '</div>' : '') +
        '</div></div></div>';
    }
    h += '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">' +
      '<button class="btn p" id="cd-saveall" style="font-size:11.5px;padding:7px 13px">' +
      rv.length + '장 저장</button>' +
      '<span id="cd-msg" style="font-size:11px;color:var(--mut);align-self:center"></span></div>';
  }
  return h + '</div>';
}

function paneCadPpl(){
  let rows = perAgg(true);
  const offs = rows.filter(r => r.off && !r.del), dels = rows.filter(r => r.del);
  rows = (cadFilt === 'trash') ? dels : (cadFilt === 'off') ? offs : rows.filter(r => !r.off && !r.del);   // 추적 안 함·휴지통은 따로 본다
  const q = perQ.trim().toLowerCase();
  if(q) rows = rows.filter(r => { const c = r.card || {};
    return [r.name, r.org, c.role, c.dept, c.memo, c.tags, c.mail].concat(c.aliases || []).concat(Object.keys(r.orgs || {}))
      .some(v => v && String(v).toLowerCase().indexOf(q) >= 0); });
  if(cadFilt === 't1')   rows = rows.filter(r => r.t1);
  if(cadFilt === 'none') rows = rows.filter(r => r.st === 'none');
  if(cadFilt === 'recent') rows = rows.slice().sort((a,b) => dnum(b.last) - dnum(a.last));
  const need = rows.filter(r => r.st === 'l').length;
  const card = rows.filter(r => r.card.name).length;
  const CH = [['over','경과순'],['recent','최근순'],['t1','T-1만'],['none','미컨택'],['off','추적 안 함' + (offs.length ? ' ' + offs.length : '')],['trash','휴지통' + (dels.length ? ' ' + dels.length : '')]];
  // 이름에 직급이 붙어 있는 것들. 해당이 없으면 이 블록은 안 뜬다.
  const rc = roleCandidates();
  let h = rvEntry() + cardBlock() + (rc.length ? '<div class="card" style="margin-bottom:10px">' +
      '<div class="cdsec" style="margin-top:0;padding-top:0;border-top:0">' +
      '직급 분리 <em>' + rc.length + '명 — 이름에 직급이 붙어 있습니다</em></div>' +
      '<div class="cnt" style="margin:2px 0 6px">이름은 명함의 키입니다. ' +
      '직급이 붙어 있으면 승진할 때 같은 사람의 이력이 둘로 쪼개집니다.</div>' +
      rc.map(c => '<div class="rsp"><span class="fr0">' + esc(c.from) + '</span>' +
        '<span class="ar">&rarr;</span><span class="to">' + esc(c.to) + '</span>' +
        '<span class="rw">' + esc(c.role) + '</span>' +
        '<span class="nn">기록 ' + c.n + '건</span>' +
        '<button class="chip" data-rsp="' + esc(c.from) + '">적용</button></div>').join('') +
      '<div style="display:flex;gap:7px;align-items:center;margin-top:9px">' +
      '<button class="btn p" id="rsp-all" style="font-size:11.5px;padding:7px 13px">' +
      '모두 적용 (' + rc.length + '명)</button>' +
      '<span style="font:10px \'JetBrains Mono\',monospace;color:var(--dim)">되돌릴 수 없습니다</span>' +
      '</div>' +
      '<div class="cnt" style="margin:7px 0 0">' +
      '적용하면 기록의 이름이 바뀌고 직급은 명함으로 옮겨집니다. ' +
      '옛 명함에 적어 둔 메모·연락처는 새 명함으로 끌어오고, 그 문서는 지우지 않습니다.' +
      '</div></div>' : '') +
    '<input id="pq" class="pq" placeholder="이름 · 별칭 · 회사 · 직책 · 메모로 찾기" value="' + esc(perQ) + '" autocomplete="off">' +
    '<div class="chips" style="margin-bottom:9px">' +
    CH.map(c => '<div class="chip' + (cadFilt === c[0] ? ' on' : '') +
      '" data-cf="' + c[0] + '">' + c[1] + '</div>').join('') +
      '<div class="chip' + (perPick ? ' on' : '') + '" data-ppick="1">선택</div></div>' +
    (perPick ? '<div class="cnt" style="margin:0 0 8px">행을 눌러 고르고, 아래에서 한 번에 바꿉니다.</div>' : '') +
    '<div class="cnt" style="margin:0 0 8px">컨택 필요 <b>' + need + '</b>명 · 전체 ' +
      rows.length + '명 · 명함 ' + card + '장' +
      '<span class="swlg">경과 <i style="opacity:.3"></i><i style="opacity:.48"></i><i style="opacity:.65"></i><i style="opacity:.83"></i><i style="opacity:1"></i> 초과</span></div>';
  if(!rows.length)
    return h + '<div class="empty">' + (q ? '"' + esc(perQ.trim()) + '" 에 맞는 사람이 없습니다.' : '아직 인물 기록이 없습니다. Field Notes에서 사람 이름을 넣어 담으세요.') + '</div>';
  if(cadFilt === 'trash'){
    h += '<div class="cdsec">휴지통 <em>' + rows.length + '명 — 복구할 수 있습니다. 기록은 남아 있습니다</em></div>' + rows.map(perRow).join('');
  }else if(cadFilt === 'off'){
    h += '<div class="cdsec">추적 안 함 <em>' + rows.length + '명 — 주기·경과 계산에서 빠집니다</em></div>' + rows.map(perRow).join('');
  }else{
    const t1 = rows.filter(r => r.t1), rest = rows.filter(r => !r.t1);
    if(t1.length) h += '<div class="cdsec">T-1 <em>지정 ' + t1.length + '명</em></div>' +
      t1.map(perRow).join('');

/* 폼 상태 보존 —
   render() 는 pane 을 통째로 다시 그린다. 컨택 종류를 바꾸거나 Firestore 스냅샷이
   들어올 때마다 일자·장소·메모가 초기화되던 문제가 여기서 났다.
   그리기 전에 입력값과 포커스를 떠서, 그린 뒤 되돌려 놓는다. */
function grabForm(){
  const v = {}, ae = document.activeElement;
  document.querySelectorAll('#panes input,#panes textarea,#panes select').forEach(el => {
    if(el.id && el.type !== 'file') v[el.id] = el.value;
  });
  const f = (ae && ae.id && v.hasOwnProperty(ae.id)) ? {
    id: ae.id,
    s: (ae.selectionStart != null ? ae.selectionStart : null),
    e: (ae.selectionEnd != null ? ae.selectionEnd : null)
  } : null;
  return {v: v, f: f};
}
function putForm(k){
  if(!k) return;
  for(const id in k.v){
    const el = $(id);
    if(el && el.value !== k.v[id]) el.value = k.v[id];
  }
  if(k.f){
    const el = $(k.f.id);
    if(el){
      try{ el.focus({preventScroll:true}); }catch(x){ el.focus(); }
      if(k.f.s != null && el.setSelectionRange){
        try{ el.setSelectionRange(k.f.s, k.f.e); }catch(x){}
      }
    }
  }
}

function render(){
  const scan = (TAB==='scan'||TAB==='watch');
  $('scanctl').style.display = scan?'':'none';
  $('cnt').style.display = scan?'':'none';
  $('list').style.display = scan?'':'none';
  $('more').style.display = (scan&&shown<view.length)?'':'none';
  if(scan){ $('panes').innerHTML=''; if(DATA) rebuild(); return; }
  const keep = grabForm();
  // 폼은 로그인 없이도 보인다. 막는 건 담을 때뿐이다.
  $('panes').innerHTML =
    ((USER || !AUTH_READY)?'':'<div class="note" style="background:none;border:1px solid var(--bd);'+
      'border-radius:9px;padding:9px 11px;font-size:11px;color:var(--mut);margin-bottom:11px">'+
      '로그인하지 않았습니다 — 폼은 볼 수 있지만 담기는 되지 않습니다.</div>')+
    (TAB==='idea'?paneIdea():(TAB==='cad'?paneCad():(TAB==='deal'?paneDeal():paneField()))) + sheetCad() + sheetPC() + sheetLog() + sheetPer() + sheetMerge() + sheetPick() + sheetRename() + sheetRv();
  putForm(keep);
  if(TAB==='cad'){
    const cf=$('cd-file');
    if(cf) cf.onchange=e=>{
      const fs=Array.from(e.target.files||[]);
      e.target.value='';
      if(fs.length) uploadCards(fs);
    };
  }
  if(TAB==='field'){
    const f=$('fn-f'); if(f) f.onchange=e=>{ fnFile=e.target.files[0]||null; render(); };
    // 권역을 바꿀 때마다 render() 하면 적던 내용이 날아간다. 표시만 토글한다.
    const z=$('fn-z'), zw=$('fn-zewrap');
    if(z && zw){
      const sync=()=>{ zw.style.display = (z.value==='ETC' ? '' : 'none'); };
      z.onchange=sync; sync();
    }
  }
}

function kpi(){
  if(!DATA) return;
  const D = DATA.dsum || {};
  const n = {new:0, live:0, watch:0, seen:0, drop:0};
  for(const r of DATA.companies) n[stOf(r.c)] = (n[stOf(r.c)]||0) + 1;

  // 컨택 필요 — Cadence 와 같은 규칙
  let cdue = 0;
  try{
    if(typeof cadAgg === 'function' && LOGS.length)
      cdue = cadAgg().filter(x => x.st === 'l').length;
  }catch(x){}

  const cell = (v, lb, sub, hi) =>
    '<div' + (hi ? ' class="hi"' : '') + '><b>' + v + '</b><i>' + lb + '</i>' +
    (sub ? '<em>' + sub + '</em>' : '') + '</div>';

  // 고정 4칸 — 내가 만든 상태 둘, 데이터가 알려주는 것 둘
  let fixed =
    cell(n.live, 'Pipeline', '쿠킹 중', true) +
    cell(n.watch, 'Watchlist', '관심 등록') +
    cell((D.exit || 0).toLocaleString(), 'Exit Due', '보유 5년+') +
    cell(cdue, 'Contact Due', '목표 주기 초과');

  // 탭별 한 줄 — 그 탭에서만 의미 있는 것
  let extra = '';
  if(TAB === 'scan' || TAB === 'watch'){
    extra = cell(DATA.companies.length.toLocaleString(), '스크리닝', '상장 유니버스') +
            cell(n.seen.toLocaleString(), '검토', '본 것') +
            cell(n.drop.toLocaleString(), '제외', '숨김') +
            cell((DATA.ev_done || 0).toLocaleString(), '공시 보유', DATA.ev_from + '~');
  }else if(TAB === 'idea'){
    const q = k => QUEUE.filter(x => x.kind === 'idea' && x.status === k).length;
    extra = cell(QUEUE.filter(x => x.kind === 'idea').length, '담은 건', '전체') +
            cell(q('pending'), '대기', '') + cell(q('running'), '처리중', '') +
            cell(q('done'), '완료', '');
  }else if(TAB === 'field'){
    const zs = {YBD:0, CBD:0, GBD:0, ETC:0};
    const en = {};
    LOGS.forEach(l => {
      if(zs[l.zone] != null) zs[l.zone]++;
      const v = zoneEtcOf(l); if(v) en[v] = (en[v] || 0) + 1;
    });
    // 기타 안에 뭐가 들었는지 — 많이 간 순 둘까지만. 나머지는 '외 n'.
    const ek = Object.keys(en).sort((a,b) => en[b] - en[a]);
    const esub = ek.slice(0,2).map(k => k + ' ' + en[k]).join(' · ') +
                 (ek.length > 2 ? ' 외 ' + (ek.length-2) : '');
    extra = cell(LOGS.length, '컨택', '누적') +
            cell(zs.YBD, '여의도', '') + cell(zs.CBD, '광화문', '') + cell(zs.GBD, '강남', '') +
            cell(zs.ETC, '기타', esub);
  }else if(TAB === 'cad'){
    let rows = [];
    try{ rows = cadAgg(); }catch(x){}
    extra = cell(rows.length, '상대', '기록 있는 곳') +
            cell(rows.filter(r => r.t1).length, 'T-1', '지정') +
            cell(rows.filter(r => r.st === 'none').length, '미컨택', '') +
            cell(defWk() + '주', '기본 주기', '');
  }else if(TAB === 'deal'){
    extra = cell((D.gp || 0).toLocaleString(), 'GP', '포트폴리오 보유') +
            cell((D.deals || 0).toLocaleString(), 'Deals', '10년 원장') +
            cell((D.pf || 0).toLocaleString(), 'Portfolio', '비상장 축') +
            cell((D.mand || 0).toLocaleString(), 'Mandated', '주관사 확인');
  }
  $('kpi').innerHTML = fixed;
  const ex = $('kpi2');
  if(ex){
    ex.innerHTML = extra; ex.style.display = extra ? '' : 'none';
    ex.classList.toggle('k5', ex.children.length === 5);
  }
}

    const box=ab.closest('details');

  const ch=e.target.closest('.chip');
  if(ch){ const g=ch.parentElement;

    if(g.id==='sorts') SORT=ch.dataset.v; else FILT=ch.dataset.v;

  if(e.target.id==='id-go'){

      // 담는 순간 그 회사는 보고 있어야 할 대상이다 — 자동으로 Watchlist 로
      const hit = DATA && DATA.companies.find(x => x.n === t);
      if(hit && stOf(hit.c) === 'new'){
        STATE[hit.c] = Object.assign({}, STATE[hit.c], {st:'watch'});
        saveState(); kpi();
      }
      $('id-a').value=''; $('id-msg').textContent='담았습니다'; }

  if(e.target.id==='fn-go' || e.target.id==='fn-brief' || e.target.id==='fn-full'){

    const full = e.target.id==='fn-full';

    if(briefOnly && !txt){ $('fn-msg').textContent='보고 초안은 적은 내용이 있어야 합니다'; return; }
    if(!briefOnly){
      // '둘 다'는 둘 다 강요하는 게 아니라 둘 다 받을 수 있다는 뜻이다.
      // 녹음만 있어도, 메모만 있어도 넘어간다.

      if(fnMode==='rec' && !fnFile){ $('fn-msg').textContent='녹음 파일을 고르세요'; return; }

    }
    e.target.disabled=true; $('fn-msg').textContent='담는 중…';

  const en=e.target.closest('[data-en]');
  if(en){

    const q=QUEUE.find(x=>x.id===en.dataset.en);

  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloaded) return; reloaded=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js')
      .then(r=>{ r.update(); setInterval(()=>r.update(), 60*60*1000); })
      .catch(()=>{});
  });
}

</script>
</body>
