<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Origination">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Origination</title>
<style>
:root{
  --bg:#faf9f7; --fg:#1a1a1a; --card:#fff; --bd:#e6e2dc; --mut:#8b8578;
  --dim:#b3ada2; --acc:#1f3864; --acc-fg:#fff; --hair:#f2efe9; --ok:#2a7; --warn:#b8860b;
  --map-bg:#111016; --map-land:#23222a; --map-bd:#35333e; --map-heat:#6f9ada;
  --map-ext:#0b0a0f; --map-ink:#e8e6e3; --map-sub:#8f8a83;
  --late:#c0392b; --late-bg:#fdeceb; --soon:#b8860b; --soon-bg:#fdf6e3;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#16151a; --fg:#e8e6e3; --card:#1f1e24; --bd:#33313a; --mut:#8f8a83;
  --dim:#6b665f; --acc:#4a6da8; --acc-fg:#fff; --hair:#26252c;
  --late:#ff7b6b; --late-bg:#3a1f1c; --soon:#e0b445; --soon-bg:#332a14;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:880px;padding:0 13px calc(40px + env(safe-area-inset-bottom));
  background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
h1{font-size:17px;margin:16px 0 1px;letter-spacing:-.2px}
.sub{color:var(--mut);font-size:11.5px}
.who{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--mut);
  margin-top:7px}
.who button{font:10.5px inherit;padding:3px 9px;border-radius:7px;border:1px solid var(--bd);
  background:var(--card);color:var(--mut);cursor:pointer}
.kpi{display:flex;gap:6px;margin:12px 0 4px}
.kpi div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:9px;
  padding:8px 4px;text-align:center}
.kpi b{display:block;font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:9.5px;color:var(--mut)}
.stick{position:sticky;top:0;z-index:30;background:var(--bg);padding:9px 0 7px;
  border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;padding:8px 13px;border:1px solid var(--bd);border-radius:8px;
  background:var(--card);color:var(--mut);font-size:12.5px;cursor:pointer;font-weight:500;
  white-space:nowrap}
.tb.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
#q{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;
  background:var(--card);color:var(--fg);font:13px inherit;margin:7px 0}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;border:1px solid var(--bd);border-radius:13px;
  background:var(--card);color:var(--mut);font-size:11px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.cnt{font-size:11px;color:var(--mut);margin:11px 0 7px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}
.row>summary{padding:10px 11px;cursor:pointer;display:flex;gap:7px;align-items:center;
  list-style:none;flex-wrap:wrap}
.row>summary::-webkit-details-marker{display:none}
.row>summary::before{content:'\25b8';color:var(--dim);font-size:11px}
.row[open]>summary::before{content:'\25be'}
.nm{font-weight:600;font-size:13.5px}
.cd{color:var(--dim);font-size:10.5px;font-variant-numeric:tabular-nums}
.spk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc);
  letter-spacing:-1px;font-size:13px}
.sz{color:var(--mut);font-size:10.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.st{font-size:9.5px;padding:2px 7px;border-radius:9px;font-weight:600}
.st-new{background:#dbeafe;color:#1e40af}.st-watch{background:#fef3c7;color:#92400e}
.st-seen{background:#eeece8;color:#7a746a}.st-drop{background:#f4f2ef;color:#b3ada2}
@media(prefers-color-scheme:dark){
.st-new{background:#1e3a6b;color:#bfd4ff}.st-watch{background:#4a3a12;color:#f0d089}
.st-seen{background:#2e2c33;color:#a8a29a}.st-drop{background:#26252c;color:#6b665f}}
.evn{background:#eef2ff;color:#3730a3;font-size:9.5px;padding:2px 7px;border-radius:9px}
@media(prefers-color-scheme:dark){.evn{background:#1e3a6b;color:#bfd4ff}}
.bd{padding:0 11px 11px;border-top:1px solid var(--hair)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:9.5px;padding:2px 7px;border-radius:9px;background:#fdecec;color:#9b2c2c}
@media(prefers-color-scheme:dark){.tag{background:#3a2020;color:#e89a9a}}
.lbl{font-size:10.5px;color:var(--mut);font-weight:600;margin:13px 0 5px}
.lbl em{font-style:normal;color:var(--dim);font-weight:400}
.unit{font-size:9.5px;color:var(--dim);text-align:right;margin-bottom:3px}
.unit em{font-style:normal}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 지표명 열은 가로 스크롤에도 고정한다. collapse 면 sticky 셀의 테두리가 사라져
   separate + border-spacing:0 을 쓰고, 경계선은 box-shadow 로 그린다. */
table.tt{width:100%;border-collapse:separate;border-spacing:0;font-size:10.5px;
  min-width:420px;font-variant-numeric:tabular-nums}
table.tt th,table.tt td{padding:3px 6px;border-bottom:1px solid var(--hair);
  text-align:right;white-space:nowrap}
table.tt thead th{color:var(--dim);font-weight:600;background:var(--card)}
table.tt tbody th{text-align:left;color:var(--mut);font-weight:500}
table.tt th:first-child{position:sticky;left:0;z-index:2;background:var(--card);
  box-shadow:1px 0 0 var(--hair)}
table.tt thead th:first-child{z-index:3}
/* Cadence */
.cdsec{font-size:9.5px;color:var(--dim);margin:11px 0 4px;letter-spacing:.3px;
  display:flex;align-items:baseline}
.cdsec em{font-style:normal;margin-left:auto}
.cdr{background:var(--card);border:1px solid var(--bd);border-radius:9px;
  padding:8px 10px;margin-bottom:5px;cursor:pointer}
.cdr.op{border-color:var(--acc)}
.cdr1{display:flex;align-items:baseline;gap:6px}
.cdr1 b{font-size:12.5px;font-weight:600}
.cdm{margin-left:auto;font-size:10px;color:var(--mut);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.cdr2{font-size:10px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.bg{font-size:9px;padding:1px 6px;border-radius:4px;font-weight:600;
  background:var(--hair);color:var(--mut)}
/* 강도는 색을 바꾸지 않고 같은 색의 진하기로만 표현한다 (Workout 히트맵 규칙) */
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--acc);
  flex:none;position:relative;top:1px}
.swlg{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--dim);margin-top:7px}
.swlg i{width:12px;height:12px;border-radius:2px;background:var(--acc);display:inline-block}
.t1{font-size:8.5px;font-weight:700;letter-spacing:.4px;background:var(--acc);
  color:var(--acc-fg);padding:1px 5px;border-radius:4px}
.pb{height:3px;border-radius:2px;background:var(--hair);margin-top:5px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--acc)}
.cdx{margin-top:9px;border-top:1px solid var(--hair);padding-top:8px}
.pp{display:flex;align-items:baseline;gap:6px;font-size:11px;padding:3px 0}
.pp b{font-weight:500}
.hz{font-size:10px;color:var(--mut);padding:2px 0;font-variant-numeric:tabular-nums}
.kinds{display:flex;gap:5px;flex-wrap:wrap}
.kb{font:11px inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);
  background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap}
.kb.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.pchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;
  border-radius:12px;background:var(--hair);color:var(--mut);cursor:pointer;margin:3px 3px 0 0}
.pchip.on{background:var(--acc);color:var(--acc-fg)}
.pchip.gh{border:1px dashed var(--bd);background:transparent;color:var(--dim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:1px solid var(--bd);border-radius:14px 14px 0 0;padding:14px 15px
  calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(0,0,0,.18);
  max-width:880px;margin:0 auto}
.shbg{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.32)}
.shh{font-size:13px;font-weight:600;margin-bottom:10px}
.zrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.zc{border-radius:7px;padding:9px 6px;text-align:center;font-size:10px;
  color:var(--map-ink);position:relative}
.zc b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.zc em{font-style:normal;font-size:8.5px;color:var(--map-sub);display:block;margin-top:2px}
.zc .zf{position:absolute;top:5px;right:6px;font-size:8.5px;padding:1px 4px;
  border-radius:3px;background:#4a1f1a;color:#ff7b6b;font-weight:700}
.ev{display:flex;gap:6px;align-items:baseline;font-size:11px;padding:4px 0;
  border-bottom:1px solid var(--hair);flex-wrap:wrap}
.evd{color:var(--dim);font-family:ui-monospace,monospace;font-size:10px}
.cat{font-size:9px;padding:1px 6px;border-radius:4px;background:#e0e7ff;color:#3730a3}
@media(prefers-color-scheme:dark){.cat{background:#1e3a6b;color:#bfd4ff}}
.ev a{color:var(--acc);text-decoration:none}
.vs b{font-size:10.5px;display:block;margin:9px 0 3px;color:var(--mut)}
.vi{font-size:11px;padding:5px 0;color:var(--fg);display:flex;gap:7px;
  text-decoration:none;border-bottom:1px solid var(--hair)}
.vi:last-child{border-bottom:none}
.vi span{color:var(--dim);font-family:ui-monospace,monospace;font-size:9.5px;
  flex:0 0 auto;padding-top:1px}
.vi i{font-style:normal;display:block}
.vi em{font-style:normal;display:block;color:var(--mut);font-size:10px;line-height:1.5;
  margin-top:2px}
.ovr{font-size:10.5px;color:var(--mut);display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px;padding-top:10px;
  border-top:1px solid var(--hair)}
.ab{font-size:11px;padding:6px 11px;border-radius:7px;border:1px solid var(--bd);
  background:var(--card);color:var(--mut);cursor:pointer;font-family:inherit;
  text-decoration:none;display:inline-block}
.ab.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.memo{width:100%;margin-top:7px;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;
  background:var(--bg);color:var(--fg);font:11.5px inherit;min-height:40px;resize:vertical}
.empty{font-size:11.5px;color:var(--dim);padding:18px 0;text-align:center}
.more{width:100%;padding:11px;margin:8px 0 0;border:1px dashed var(--bd);border-radius:9px;
  background:none;color:var(--mut);font:12px inherit;cursor:pointer}
.ft{color:var(--dim);font-size:10px;margin-top:22px;padding-top:11px;
  border-top:1px solid var(--bd);line-height:1.7}
.load{text-align:center;padding:60px 0;color:var(--mut);font-size:12.5px}
.pane{display:none}.pane.on{display:block}
/* ── 폼 ── */
.card{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:14px;
  margin-bottom:11px}
.fr{margin-bottom:10px}
.fr label{display:block;font-size:10.5px;color:var(--mut);margin-bottom:4px;font-weight:600}
.fr label em{font-style:normal;color:var(--dim);font-weight:400}
.fr input,.fr select,.fr textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);
  border-radius:8px;font:13px -apple-system,'Segoe UI',sans-serif;background:var(--bg);
  color:var(--fg)}
.fr textarea{min-height:76px;resize:vertical}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.seg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;
  margin-bottom:10px}
.seg div{flex:1;text-align:center;padding:9px;font-size:12px;color:var(--mut);
  background:var(--card);cursor:pointer}
.seg div.on{background:var(--acc);color:var(--acc-fg)}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:20px;text-align:center;
  color:var(--mut);font-size:12px;background:var(--bg);cursor:pointer}
.drop b{display:block;font-size:21px;margin-bottom:5px}
.drop.has{border-style:solid;border-color:var(--acc);color:var(--acc)}
.btn{font-size:12px;padding:9px 16px;border-radius:8px;border:1px solid var(--bd);
  background:var(--card);color:var(--mut);font-family:inherit;cursor:pointer}
.btn.p{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.btn:disabled{opacity:.45}
.qrow{display:flex;gap:8px;align-items:center;font-size:11.5px;padding:8px 0;
  border-bottom:1px solid var(--hair);flex-wrap:wrap}
.qs{font-size:9.5px;padding:2px 8px;border-radius:9px}
.q-wait{background:#eeece8;color:#7a746a}.q-run{background:#fef3c7;color:#92400e}
.q-ok{background:#dcfce7;color:#166534}.q-err{background:#fee2e2;color:#991b1b}
@media(prefers-color-scheme:dark){
.q-wait{background:#26252c;color:#a8a29a}.q-run{background:#4a3a12;color:#f0d089}
.q-ok{background:#14371f;color:#8fdca8}.q-err{background:#3a2020;color:#e89a9a}}
pre.out{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:11px 12px;
  font:11.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
  color:var(--fg);margin:0;max-height:400px;overflow:auto}
/* ── 지도 ── */
.mapbox{background:var(--map-bg);border-radius:12px;padding:6px;overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(21,1fr);gap:3px;margin:6px 0}
.cel{aspect-ratio:1;border-radius:2px;background:var(--hair)}
.cel.l1{background:var(--acc);opacity:.28}.cel.l2{background:var(--acc);opacity:.5}
.cel.l3{background:var(--acc);opacity:.72}.cel.l4{background:var(--acc);opacity:.95}
.callg{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--dim);
  justify-content:flex-end}
.callg i{width:11px;height:11px;border-radius:2px;display:block}
.lg{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:9px}
.lg b{color:var(--fg)}
.combo{position:relative}
.combo input{width:100%}
.combo ul{list-style:none;margin:5px 0 0;padding:0;max-height:230px;overflow-y:auto;
  border:1px solid var(--bd);border-radius:8px;background:var(--card);display:none;
  -webkit-overflow-scrolling:touch}
.combo ul.on{display:block}
.combo li{padding:9px 11px;font-size:12.5px;cursor:pointer;
  border-bottom:1px solid var(--hair)}
.combo li:last-child{border-bottom:none}
.combo li b{font-weight:600}
.combo li i{font-style:normal;color:var(--dim);font-size:10px;margin-left:6px}
.combo li.hd{color:var(--dim);font-size:10px;font-weight:600;background:var(--bg);
  cursor:default;letter-spacing:.4px}
.combo li.new{color:var(--acc);font-weight:600}
.gate{text-align:center;padding:50px 14px}
.gate p{font-size:12px;color:var(--mut);margin:10px 0 18px;line-height:1.7}
</style>
</head>
<body>

<h1>Origination</h1>
<div class="sub" id="hd">불러오는 중…</div>
<div class="who" id="who"></div>

<div class="kpi" id="kpi"></div>

<div class="stick">
  <div class="tabs">
    <div class="tb on" data-t="scan">Screening</div>
    <div class="tb" data-t="watch">Watchlist</div>
    <div class="tb" data-t="idea">Ideas</div>
    <div class="tb" data-t="field">Field Notes</div>
    <div class="tb" data-t="cad">Cadence</div>
    <div class="tb" data-t="deal">Deals</div>
  </div>
  <div id="scanctl">
    <input id="q" placeholder="회사명 · 종목코드" autocomplete="off">
    <div class="chips" id="sorts"></div>
    <div class="chips" id="filts" style="margin-top:5px"></div>
  </div>
</div>

<div class="cnt" id="cnt"></div>
<div id="list"><div class="load">데이터를 받는 중…</div></div>
<button class="more" id="more" style="display:none">더 보기</button>
<div id="panes"></div>

<div class="ft" id="ft"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
         setPersistence, browserLocalPersistence }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, setDoc, onSnapshot, query,
         orderBy, limit, serverTimestamp, enableIndexedDbPersistence }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { getStorage, ref as sref, uploadBytes, getDownloadURL }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';

const BUILD = '20260830_1147';
const PAGE = 80;

// Workout 과 같은 프로젝트. 계정이 하나라 큐도 하나로 둔다.
const app = initializeApp({
  apiKey: "AIzaSyCmo9gyAFNfRaSR0GdyJ2BmamhpzfYuQGE",
  authDomain: "routine-log-7d91b.firebaseapp.com",
  projectId: "routine-log-7d91b",
  storageBucket: "routine-log-7d91b.firebasestorage.app",
  messagingSenderId: "271884499594",
  appId: "1:271884499594:web:12217347b04ab2448d8b73"
});
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence);
const db = getFirestore(app);
const storage = getStorage(app);
// 오프라인에서도 담기가 되게 — 연결되면 SDK 가 알아서 올린다
enableIndexedDbPersistence(db).catch(() => {});

let DATA = null, ENT = null, MAP = null, GEO = null, USER = null;
let STATE = {}, LOGS = [], QUEUE = [];
let CAD = {};                 // company -> {tier, target_wk, memo}
let cadOpen = null, cadSheet = null, fnKind = 'meet', fnPeople = [], fnQuick = true;
let DEALS = null, dealOpen = null, dealQ = '', dealMode = 'gp';
const KW = {meet:1.0, meal:1.0, call:0.5, mail:0.3};
const KLBL = {meet:'미팅', meal:'식사', call:'통화', mail:'메일'};
const DEF_WK = 8;             // 전역 기본 주기
let TAB = 'scan', SORT = 'ev', FILT = 'all', shown = 0, view = [];

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const VAULT = 'Obsidian BU - Shawn';
const obs = p => 'obsidian://open?vault=' + encodeURIComponent(VAULT) +
                 '&file=' + encodeURIComponent(String(p).replace(/\.md$/, ''));
const F = {
  eok: v => v==null?'':v.toLocaleString('ko-KR',{maximumFractionDigits:0}),
  pct: v => v==null?'':(v*100).toFixed(1)+'%',
  x:   v => v==null?'':v.toFixed(1)+'x',
  d:   v => v==null?'':v.toLocaleString('ko-KR')+'d',
};
const $ = id => document.getElementById(id);
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+
  String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

function spark(vals){
  const v = vals.filter(x=>x!=null);
  if (v.length<2) return '';
  const lo=Math.min(...v), hi=Math.max(...v), r=(hi-lo)||1, b='▁▂▃▄▅▆▇';
  return vals.map(x=>x==null?'·':b[Math.min(Math.floor((x-lo)/r*6),6)]).join('');
}

/* ── 인증 ─────────────────────────────────────── */
onAuthStateChanged(auth, u => {
  USER = u;
  $('who').innerHTML = u

  ['debt','차입금 증가',(a,b)=>(b.dg==null?-9:b.dg)-(a.dg==null?-9:a.dg)],

  ['rev','매출 역성장',(a,b)=>(a.rg==null?9:a.rg)-(b.rg==null?9:b.rg)],
  ['score','스코어',(a,b)=>b.sc-a.sc],
];
const FILTS = [['all','전체'],['new','미검토'],['watch','관심'],['seen','검토'],
               ['nodrop','제외 숨김']];

function rebuild(){
  const q = ($('q').value||'').trim().toLowerCase();
  let rows = DATA.companies;
  if (TAB==='watch') rows = rows.filter(r=>stOf(r.c)==='watch');
  else if (FILT==='nodrop') rows = rows.filter(r=>stOf(r.c)!=='drop');
  else if (FILT!=='all') rows = rows.filter(r=>stOf(r.c)===FILT);
  if (q) rows = rows.filter(r=>r.n.toLowerCase().includes(q)||(r.s||'').includes(q));
  view = rows.slice().sort(SORTS.find(s=>s[0]===SORT)[2]);
  shown = 0; $('list').innerHTML='';
  $('cnt').textContent = view.length.toLocaleString()+'사'+(q?' · "'+q+'"':'');
  page();
}
function page(){
  const frag=document.createDocumentFragment(), end=Math.min(shown+PAGE,view.length);
  for(let i=shown;i<end;i++) frag.appendChild(rowEl(view[i]));
  $('list').appendChild(frag); shown=end;
  const m=$('more');
  if(shown<view.length){m.style.display='';m.textContent='더 보기 ('+(view.length-shown).toLocaleString()+'사 남음)';}
  else m.style.display='none';
  if(!view.length) $('list').innerHTML='<div class="empty">해당하는 회사가 없습니다</div>';
}

function table(periods,src,lab){

const COMBO = {};   // id -> 확정된 값

function comboHTML(id, ph){
  return '<div class="combo" data-combo="'+id+'">'+
    '<input id="'+id+'" placeholder="'+ph+'" autocomplete="off">'+
    '<ul id="'+id+'-l"></ul></div>';
}
function comboFill(id, q){
  const ul=$(id+'-l'); if(!ul||!ENT) return;
  const s=(q||'').trim().toLowerCase();
  let rows=ENT.items;
  if(s) rows=rows.filter(x=>x.n.toLowerCase().includes(s));
  const cap=rows.slice(0,60);
  let h='';
  let lastG='';
  for(const x of cap){
    if(x.g!==lastG){
      const gl=(ENT.groups.find(g=>g.k===x.g)||{}).l||x.g;
      h+='<li class="hd">'+esc(gl)+'</li>'; lastG=x.g;
    }
    h+='<li data-v="'+esc(x.n)+'"><b>'+esc(x.n)+'</b>'+
       (x.p?'<i>vault</i>':'')+'</li>';
  }
  if(s && !cap.some(x=>x.n===q))
    h='<li class="new" data-v="'+esc(q)+'">+ "'+esc(q)+'" 그대로 쓰기</li>'+h;
  if(!h) h='<li class="hd">일치하는 곳이 없습니다</li>';
  if(rows.length>cap.length)
    h+='<li class="hd">+'+(rows.length-cap.length).toLocaleString()+'곳 더 — 더 적어보세요</li>';
  ul.innerHTML=h; ul.classList.add('on');
}
function comboVal(id){ return (COMBO[id]!=null?COMBO[id]:($(id)?$(id).value:'')).trim(); }

async function saveContact(company, kind, people, extra){
  if(!USER) { needLogin(); return false; }
  const rec = Object.assign({
    company: company, title: company, date: todayStr(),
    kind: kind, weight: (KW[kind] || 1), people: people || [],
    zone: '', place: '', note: '', mode: 'quick'
  }, extra || {});
  const xy = resolveXY(rec.place, rec.zone, company);
  rec.x = xy[0]; rec.y = xy[1]; rec.src = xy[2];
  await addDoc(collection(db, 'users', USER.uid, 'field_notes'),
    Object.assign({}, rec, {at: serverTimestamp()}));
  return true;
}

document.addEventListener('click', async e => {
  // 시트 닫기
  if(e.target.dataset && e.target.dataset.shx){ cadSheet = null; render(); return; }

  // 요약 줄 탭 -> Cadence
  const gt = e.target.closest('[data-goto]');
  if(gt){
    TAB = gt.dataset.goto;
    document.querySelectorAll('.tb').forEach(x =>
      x.classList.toggle('on', x.dataset.t === TAB));
    render(); window.scrollTo(0,0); return;
  }

  // Deals 모드 칩
  const dm = e.target.closest('[data-dm]');
  if(dm){ dealMode = dm.dataset.dm; dealOpen = null; render(); return; }

  // Deals GP 카드 펼치기
  const dc = e.target.closest('[data-deal]');
  if(dc && !e.target.closest('a')){
    const k = dc.dataset.deal;
    dealOpen = (dealOpen === k) ? null : k;
    render(); return;
  }

  // Cadence 필터 칩
  const cf = e.target.closest('[data-cf]');
  if(cf){ cadFilt = cf.dataset.cf; render(); return; }

  // 설정 시트 열기
  const cs = e.target.closest('[data-cs]');
  if(cs){ cadSheet = cs.dataset.cs; render(); return; }

  // 시트 안 주기 칩
  const wk = e.target.closest('.sheet [data-wk]');
  if(wk){
    wk.parentNode.querySelectorAll('[data-wk]').forEach(x => x.classList.remove('on'));
    wk.classList.add('on'); return;
  }
  // 시트 안 티어
  const tr = e.target.closest('.sheet [data-tier]');
  if(tr){
    tr.parentNode.querySelectorAll('[data-tier]').forEach(x => x.classList.remove('on'));
    tr.classList.add('on'); return;
  }
  // 시트 저장
  if(e.target.id === 'cd-save'){
    const sh = e.target.closest('.sheet');
    const w = sh.querySelector('[data-wk].on');
    const t = sh.querySelector('[data-tier].on');
    const memo = sh.querySelector('#cd-memo');
    const o = {target_wk: w ? +w.dataset.wk : defWk()};
    if(cadSheet === '__default'){
      try{ await saveCad('__default', o); }catch(x){ alert(x.message); return; }
    }else{
      o.tier = (t && t.dataset.tier) ? 'T1' : null;
      o.memo = memo ? memo.value.trim() : '';
      try{ await saveCad(cadSheet, o); }catch(x){ alert(x.message); return; }
    }
    cadSheet = null; render(); return;
  }

  // Cadence 행에서 바로 컨택 담기
  const cq = e.target.closest('[data-cq]');
  if(cq){
    const c = cq.dataset.cq;
    cq.disabled = true; cq.textContent = '담는 중…';
    try{ if(await saveContact(c, 'meet', [])) { cq.textContent = '담았습니다'; } }
    catch(x){ cq.textContent = '실패 — ' + x.message; cq.disabled = false; }
    return;
  }

  // Cadence 행 펼치기 (버튼 클릭이 아닐 때만)
  const cdr = e.target.closest('[data-cad]');
  if(cdr && !e.target.closest('button')){
    const c = cdr.dataset.cad;
    cadOpen = (cadOpen === c) ? null : c;
    render(); return;
  }

  // 컨택 종류 선택
  const kb = e.target.closest('[data-kind]');
  if(kb){ fnKind = kb.dataset.kind; render(); return; }

  // 인물 칩 토글 / 새 이름
  const pp = e.target.closest('[data-pp]');
  if(pp){
    const n = pp.dataset.pp, i = fnPeople.indexOf(n);
    if(i >= 0) fnPeople.splice(i, 1); else fnPeople.push(n);
    render(); return;
  }
  if(e.target.closest('[data-ppnew]')){
    const n = (prompt('이름을 입력하세요 (예: 김OO 상무)') || '').trim();
    if(n && fnPeople.indexOf(n) < 0) fnPeople.push(n);
    render(); return;
  }

  // 노트·녹음 펼치기
  if(e.target.id === 'fn-more'){ fnQuick = !fnQuick; render(); return; }

  // 컨택만 담기
  if(e.target.id === 'fn-quick'){
    const c = comboVal('fn-c');
    if(!c){ $('fn-qmsg').textContent = '상대를 고르세요'; return; }
    e.target.disabled = true; $('fn-qmsg').textContent = '담는 중…';
    try{
      const zsel = $('fn-z'), psel = $('fn-l');
      const ok = await saveContact(c, fnKind, fnPeople.slice(), {
        zone: zsel ? zsel.value : '', place: psel ? psel.value.trim() : ''});
      if(ok){ fnPeople = []; $('fn-qmsg').textContent = '담았습니다'; }
    }catch(x){ $('fn-qmsg').textContent = '실패 — ' + x.message; }
    e.target.disabled = false;
    setTimeout(() => { if($('fn-qmsg')) render(); }, 700);
    return;
  }
});

/* ── 보고 초안 — 국문이 나오면 그 자리에서 영문으로 ── */
function briefCards(){
  const KIND = ['field','brief','full'];
  const rows = QUEUE.filter(q=>KIND.includes(q.kind) && q.status==='done' && q.output)
                    .slice(0,3);
  if(!rows.length) return '';
  return rows.map(q=>{
    // full 은 영문까지 한 번에 만들어 output_en 에 담겨 온다.
    // 그 외에는 별도로 담은 word 큐가 붙는다.
    const wq = QUEUE.find(w=>w.kind==='word' && w.parent===q.id);
    const enText = q.output_en || (wq && wq.output) || '';
    let h = '<div class="lbl">보고 초안 · 국문 <em>'+esc(q.company||q.title||'')+
      ' · '+esc(qWhen(q))+'</em></div><div class="card">'+
      '<pre class="out">'+esc(q.output)+'</pre>'+
      '<div class="acts"><button class="btn" data-copy="'+q.id+'">복사</button>'+
      (enText||wq ? '' : '<button class="btn p" data-en="'+q.id+'">영문으로</button>')+
      (q.result_path ? '<a class="btn" href="'+obs(q.result_path)+'">노트 →</a>' : '')+
      '</div>';
    if(enText){
      h += '<div class="lbl" style="margin-top:14px">영문</div>';
      h += '<pre class="out">'+esc(enText)+'</pre>'+
        '<div class="acts"><button class="btn" data-copy="'+
        (q.output_en?q.id+':en':wq.id)+'">복사</button></div>';
    }else if(wq){
      const [lb,cls]=QLBL[wq.status]||QLBL.pending;
      h += '<div class="lbl" style="margin-top:14px">영문 <em><span class="qs '+cls+'">'+
        lb+'</span></em></div>'+
        '<div class="empty" style="padding:8px 0">PC가 처리하면 여기 뜹니다</div>';
    }
    return h+'</div>';
  }).join('');
}

/* ── 좌표 해석 ─────────────────────────────────
   landmark → dong → gu → 권역 안 고정 지터(회사명 해시). 근거는 src 로 남긴다. */
function hash32(s){ let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0; }

function resolveXY(place, zone, company){
  if(!GEO) return [null,null,''];
  const p=(place||'').trim();
  if(p){
    for(const k of Object.keys(GEO.landmark))
      if(p.includes(k)) return [...GEO.landmark[k],'landmark'];
    for(const k of Object.keys(GEO.dong))
      if(p.includes(k)) return [...GEO.dong[k],'dong'];
    for(const k of Object.keys(GEO.gu))
      if(p.includes(k)) return [...GEO.gu[k],'gu'];
  }
  const rep={YBD:'영등포구',CBD:'중구',GBD:'강남구'}[zone];
  if(!rep||!GEO.gu[rep]) return [null,null,''];
  const c=GEO.gu[rep], h=hash32(company||'');
  const a=(h%3600)/3600*Math.PI*2, r=14+((h>>12)%26);
  return [+(c[0]+r*Math.cos(a)).toFixed(1), +(c[1]+r*Math.sin(a)).toFixed(1), 'jitter'];
}

/* -- 커버리지 -------------------------------------
   권역별 마지막 컨택 경과. 목표는 전역 기본 주기를 따른다. */
function coverage(){
  const zs = ['YBD','CBD','GBD'];
  const last = {}, cnt = {};
  for(const l of LOGS){
    const z = l.zone; if(zs.indexOf(z) < 0) continue;
    cnt[z] = (cnt[z]||0) + 1;
    if(!last[z] || l.date > last[z]) last[z] = l.date;
  }
  const lim = defWk() * 7;
  const ZKO = {YBD:'여의도', CBD:'광화문', GBD:'강남'};
  const cells = zs.map(z => {
    const d = last[z] ? daysAgo(last[z]) : null;
    const over = (d != null) && (d > lim);          // 기록이 없으면 '필요'가 아니라 '없음'
    const t = d == null ? 0 : Math.max(0, 1 - Math.min(d, lim*2) / (lim*2));
    const bgv = Math.round(18 + 60 * t);
    return '<div class="zc" style="background:rgb(' + Math.round(bgv*0.55) + ',' +
      Math.round(bgv*0.78) + ',' + Math.round(bgv*1.35) + ')">' +
      (over ? '<span class="zf">필요</span>' : '') +
      '<b>' + (cnt[z]||0) + '</b>' + z + ' ' + ZKO[z] +
      '<em>' + (d == null ? '기록 없음' : '최근 ' + d + '일 전') + '</em></div>';
  }).join('');

  const rows = cadAgg().filter(r => r.st === 'l');
  const t1n = rows.filter(r => r.t1).length;
  const top = rows.slice(0, 3).map(r => esc(r.company) + ' ' + r.days + '일').join(' · ');
  const sum = !rows.length ? '' :
    '<div class="cdr" data-goto="cad" style="margin-top:9px">' +
      '<div class="cdr1"><b style="color:var(--late)">컨택 필요 ' + rows.length + '곳</b>' +
      '<span class="cdm">T-1 ' + t1n + ' · 기본 ' + (rows.length - t1n) + '</span></div>' +
      '<div class="cdr2">' + top + (rows.length > 3 ? ' 외 ' + (rows.length-3) + '곳' : '') +
      ' — 탭하면 Cadence로</div></div>';

  return '<div class="lbl" style="margin-top:14px">권역 커버리지 ' +
    '<em>목표 ' + defWk() + '주</em></div><div class="zrow">' + cells + '</div>' + sum;
}

function heatmap(){
  if(!MAP) return '';
  const cnt={CBD:0,YBD:0,GBD:0}, days={};
  for(const l of LOGS){
    if(cnt[l.zone]!=null) cnt[l.zone]++;
    days[l.date]=(days[l.date]||0)+1;
  }
  const mx=Math.max(1,...Object.values(cnt));
  let g='';
  for(let i=13;i>0;i--)
    g+='<g transform="translate(0,'+i+')">'+
       Object.values(MAP.gu).map(d=>'<path d="'+d+'" fill="var(--map-ext)"/>').join('')+'</g>';
  g+=Object.values(MAP.gu).map(d=>'<path d="'+d+
    '" fill="var(--map-land)" stroke="var(--map-bd)" stroke-width="1.1" stroke-linejoin="round"/>').join('');
  for(const z of ['CBD','YBD','GBD']){
    const zo=MAP.zones[z], ratio=cnt[z]/mx;
    for(const gu of zo.gu){
      g+='<g filter="url(#glow)" opacity="'+(0.22+0.5*ratio).toFixed(2)+'"><path d="'+
         MAP.gu[gu]+'" fill="var(--map-heat)"/></g>';
      g+='<path d="'+MAP.gu[gu]+'" fill="var(--map-heat)" fill-opacity="'+
         (0.14+0.62*ratio).toFixed(2)+'" stroke="var(--map-heat)" stroke-width="1.8" '+
         'stroke-linejoin="round"/>';
    }
    const c=zo.c;
    g+='<text x="'+c[0]+'" y="'+(c[1]-4)+'" text-anchor="middle" font-size="30" '+
       'font-weight="700" fill="var(--map-ink)" opacity="0.9">'+cnt[z]+'</text>'+
       '<text x="'+c[0]+'" y="'+(c[1]+15)+'" text-anchor="middle" font-size="12" '+
       'font-weight="600" letter-spacing="1.6" fill="var(--map-sub)">'+z+'</text>'+
       '<text x="'+c[0]+'" y="'+(c[1]+30)+'" text-anchor="middle" font-size="11" '+
       'fill="var(--map-sub)" opacity="0.8">'+zo.ko+'</text>';
  }
  // 방문 도트 — 한 건에 하나. 같은 자리에 쌓이면 투명도가 겹쳐 저절로 진해진다
  const spot={};
  for(const l of LOGS){
    let x=l.x,y=l.y;
    if(x==null||y==null){ const r=resolveXY(l.place,l.zone,l.company); x=r[0]; y=r[1]; }
    if(x==null) continue;
    const k=x+','+y; (spot[k]=spot[k]||[]).push(l);
  }
  for(const k in spot){
    const [x,y]=k.split(',').map(Number);
    spot[k].forEach((l,i)=>{
      const a=i*2.399963, r=3.6*Math.sqrt(i);
      g+='<circle cx="'+(x+r*Math.cos(a)).toFixed(1)+'" cy="'+(y+r*Math.sin(a)).toFixed(1)+
         '" r="4.6" fill="#9fc4f0" fill-opacity="0.34"><title>'+
         esc(l.company+' · '+l.date+(l.place?' · '+l.place:''))+'</title></circle>';
    });
  }
  const cells=[]; const d0=new Date(); d0.setDate(d0.getDate()-62);
  for(let i=0;i<63;i++){
    const d=new Date(d0); d.setDate(d0.getDate()+i);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+
      String(d.getDate()).padStart(2,'0');
    const v=days[key]||0;
    cells.push('<div class="cel l'+(v===0?0:Math.min(v,4))+'" title="'+key+' · '+v+'건"></div>');
  }
  return '<div class="lbl">권역 방문 <em>기록 '+LOGS.length+'건</em></div>'+
    '<div class="mapbox"><svg viewBox="'+MAP.vb+'" style="width:100%;display:block">'+
      '<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%">'+
      '<feGaussianBlur stdDeviation="11"/></filter></defs>'+g+'</svg></div>'+
    '<div class="lg"><span>여의도 <b>'+cnt.YBD+'</b></span><span>강남 <b>'+cnt.GBD+
      '</b></span><span>광화문 <b>'+cnt.CBD+'</b></span></div>'+
    '<div class="lbl" style="margin-top:14px">최근 9주 <em>하루 한 칸</em></div>'+
    '<div class="cal">'+cells.join('')+'</div>'+
    '<div class="callg"><span>적음</span>'+
      [0,1,2,3,4].map(i=>'<i class="cel l'+i+'"></i>').join('')+'<span>많음</span></div>'+
    coverage();
}



/* -- 빠른 컨택 --------------------------------------
   노트도 녹음도 없이 컨택만 남긴다. 큐를 태우지 않으므로 LLM 비용이 0이다. */
function peopleOf(company){
  const seen = {};
  for(const l of LOGS){
    if((l.company||l.title) !== company) continue;
    for(const n of (l.people||[])) seen[n] = (seen[n]||0) + 1;
  }
  return Object.keys(seen).sort((a,b) => seen[b] - seen[a]).slice(0, 8);
}

function quickBlock(){
  const c = (COMBO['fn-c'] || '');
  const cand = c ? peopleOf(c) : [];
  const chips = cand.map(n => '<span class="pchip' +
      (fnPeople.indexOf(n) >= 0 ? ' on' : '') + '" data-pp="' + esc(n) + '">' +
      esc(n) + '</span>').join('') +
    fnPeople.filter(n => cand.indexOf(n) < 0).map(n =>
      '<span class="pchip on" data-pp="' + esc(n) + '">' + esc(n) + ' ×</span>').join('') +
    '<span class="pchip gh" data-ppnew="1">+ 이름 입력</span>';
  const ks = Object.keys(KLBL).map(k => '<button class="kb' +
      (fnKind === k ? ' on' : '') + '" data-kind="' + k + '">' + KLBL[k] + '</button>').join('');
  return '<div class="fr"><label>사람 <em style="font-style:normal;color:var(--dim)">' +
      '이 조직에서 만난 사람</em></label><div>' + chips + '</div></div>' +
    '<div class="fr"><label>컨택 종류</label><div class="kinds">' + ks + '</div></div>' +
    '<div style="display:flex;gap:6px;margin:9px 0 4px">' +
      '<button class="btn p" id="fn-quick">컨택만 담기</button>' +
      '<button class="btn" id="fn-more">' + (fnQuick ? '+ 노트·녹음까지' : '접기') + '</button>' +
      '<span id="fn-qmsg" style="font-size:11px;color:var(--mut);align-self:center"></span></div>';
}



/* 강도 = 색 하나 + opacity. Workout heatmap 과 같은 식.
   opacity = 0.3 + 0.7 x min(v/max, 1) */
const inten = (v, mx) => (v == null ? null :
  Math.round((0.3 + 0.7 * Math.min(v / mx, 1)) * 100) / 100);
const swatch = o => o == null ? '<span class="sw" style="opacity:.12"></span>'
  : '<span class="sw" style="opacity:' + o + '"></span>';
const HOLD_MAX = 15, CAD_MAX = 2;

/* -- Deals -- GP 기준 딜 원장 -----------------------
   상장 딜은 DART 공시 10년, 비상장은 홈페이지·vault 에서 왔다.
   deals.json 은 탭을 처음 열 때만 받는다(367KB). */
const OCL = {closed:['성사','bg-o'], dropped:['드랍','bg-l'], open:['진행·보유','bg-s']};

async function loadDeals(){
  if(DEALS) return DEALS;
  try{
    const r = await fetch('deals.json', {cache:'no-cache'});
    DEALS = await r.json();
  }catch(x){ DEALS = {gp:[], all:[], drops:[], stat:{}}; }
  return DEALS;
}

function dealLine(d){
  const per = d[1] ? (d[1].slice(2,4)+'.'+d[1].slice(4,6) +
      (d[2] && d[2] !== d[1] ? '~'+d[2].slice(2,4)+'.'+d[2].slice(4,6) : '')) : '';
  const hy = d[10];                       // 보유연수 (회수분은 회수까지 걸린 연수)
  const oc = d[3] === 'closed' ? '회수' : (d[3] === 'dropped' ? '무산' : '보유');
  return '<div class="hz" style="display:flex;gap:6px;align-items:baseline">' +
    swatch(d[3] === 'closed' ? null : inten(hy, HOLD_MAX)) +
    '<span style="color:var(--dim);min-width:64px">' + per + '</span>' +
    '<b style="font-weight:600;font-size:11px">' + esc(d[0]) + '</b>' +
    (hy != null ? '<span class="cdm">' + hy + '년 ' + oc + '</span>'
                : '<span class="cdm">' + oc + '</span>') +
    '</div>' +
    '<div style="font-size:9.5px;color:var(--dim);margin:0 0 4px 80px">' +
    esc(d[4]) + (d[5] ? ' · ' + esc(d[5]) : '') +
    (d[6] ? ' · 양수도 ' + d[6].toLocaleString() + '억' : '') +
    (d[7] ? ' · ' + esc(d[7]) : '') + (d[9] ? ' · ' + esc(d[9]) : '') +
    (d[11] ? ' · 보유확인' : '') + '</div>';
}

function gpCard(g){
  const open = dealOpen === g.i;
  const need = g.need || [], ex = g.exit || [];
  let h = '<div class="cdr' + (open ? ' op' : '') + '" data-deal="' + esc(g.i) + '">' +
    '<div class="cdr1">' +
      (need.length ? swatch(inten(need[0][10], HOLD_MAX)) : '') +
      '<b>' + esc(g.n) + '</b>' +
      (g.off ? '<span class="bg">등록부 밖</span>' : '') +
      '<span class="cdm">딜 ' + g.d.length +
        (need.length ? ' · 엑싯 ' + need.length : '') + '</span></div>' +
    '<div class="cdr2">' + (g.e ? esc(g.e) + ' · ' : '') +
      (g.pc ? '펀드 ' + g.pc + '개' + (g.amt ? ' · 약정 ' +
        (g.amt >= 10000 ? (g.amt/10000).toFixed(1) + '조' : g.amt.toLocaleString() + '억') : '')
        : '등록 펀드 없음') +
      (g.med ? ' · 회수 중앙값 ' + g.med + '년' : '') + '</div>';
  if(open){
    h += '<div class="cdx">';
    if(need.length){
      h += '<div class="cdsec">엑싯 필요 <em>보유 5년 이상 ' + need.length + '곳</em></div>';
      for(const d of need) h += dealLine(d);
    }
    if(ex.length){
      h += '<div class="cdsec">회수 완료 <em>벤치마크' +
           (g.med ? ' · 중앙값 ' + g.med + '년' : '') + '</em></div>';
      for(const d of ex) h += dealLine(d);
    }
    if(g.f.length){
      h += '<div class="cdsec">펀드 <em>' + g.pc + '개</em></div>';
      for(const f of g.f.slice(0,12))
        h += '<div class="hz">' + esc(f[0]) + (f[1] ? ' · ' + f[1] : '') +
             (f[2] ? ' · ' + Number(f[2]).toLocaleString() + '억' : '') + '</div>';
      if(g.f.length > 12) h += '<div class="hz" style="color:var(--dim)">외 ' +
        (g.f.length-12) + '개</div>';
    }
    const rest = g.d.filter(x => need.indexOf(x) < 0 && ex.indexOf(x) < 0);
    if(rest.length){
      h += '<div class="cdsec">그 외 <em>' + rest.length + '건</em></div>';
      for(const d of rest) h += dealLine(d);
    }
    if(g.vn) h += '<div style="margin-top:8px"><a class="ab" href="' + obs(g.vn) +
      '">vault 노트 →</a></div>';
    h += '</div>';
  }
  return h + '</div>';
}

function paneDeal(){
  if(!DEALS) { loadDeals().then(() => { if(TAB === 'deal') render(); });
    return '<div class="load">딜 원장을 받는 중…</div>'; }
  const st = DEALS.stat || {};
  const head = '<div class="cnt" style="margin:0 0 8px">GP ' +
    DEALS.gp.length.toLocaleString() + '곳 · 딜 ' + DEALS.all.length.toLocaleString() +
    '건 · 드랍 ' + DEALS.drops.length + '건<br>' +
    '<span style="color:var(--dim)">' +
    Object.keys(st).map(k => k + ' ' + st[k].toLocaleString()).join(' · ') + '</span></div>';
  const modes = [['gp','GP'],['deal','PC'],['drop','Drop']];
  const chips = '<div class="chips" style="margin-bottom:9px">' +
    modes.map(m => '<div class="chip' + (dealMode === m[0] ? ' on' : '') +
      '" data-dm="' + m[0] + '">' + m[1] + '</div>').join('') + '</div>' +
    '<input id="dq" placeholder="' +
      (dealMode === 'gp' ? 'GP 이름' : (dealMode === 'deal' ? '회사 이름' : '회사·GP·상대')) + '" value="' + esc(dealQ) +
      '" autocomplete="off">';

  const q = dealQ.trim().toLowerCase();
  let body = '';
  if(dealMode === 'gp'){
    let rows = DEALS.gp;
    if(q) rows = rows.filter(g => (g.n + ' ' + (g.e||'')).toLowerCase().includes(q));
    body = rows.slice(0, 80).map(gpCard).join('') ||
      '<div class="empty">해당하는 GP가 없습니다</div>';
    if(rows.length > 80) body += '<div class="cnt">외 ' + (rows.length-80) + '곳</div>';
  }else if(dealMode === 'deal'){
    let rows = DEALS.all;
    if(q) rows = rows.filter(d => (d[0] + ' ' + d[5]).toLowerCase().includes(q));
    body = '<div class="card">' + rows.slice(0, 200).map(d =>
      dealLine([d[0], d[1], d[2], d[3], d[4], '', d[6], d[7],
                '', d[5] || '', d[8], 0]))
      .join('') + '</div>';
    if(rows.length > 200) body += '<div class="cnt">외 ' + (rows.length-200) + '건 — 더 적어보세요</div>';
  }else{
    let rows = DEALS.drops;
    if(q) rows = rows.filter(d => (d[1] + ' ' + d[2]).toLowerCase().includes(q));
    body = '<div class="card">' + rows.map(d =>
      '<div class="hz" style="display:flex;gap:6px">' +
      '<span style="color:var(--dim);min-width:56px">' +
        (d[0] ? d[0].slice(2,4)+'.'+d[0].slice(4,6) : '—') + '</span>' +
      '<b style="font-weight:600;font-size:11px">' + esc(d[1]) + '</b>' +
      (d[2] ? '<span style="color:var(--mut)">' + esc(d[2]) + '</span>' : '') +
      '<span class="cdm">' + esc(d[3]) + '</span></div>' +
      (d[4] ? '<div style="font-size:9.5px;color:var(--dim);margin:0 0 5px 62px">상대 ' +
        esc(d[4]) + (d[5] ? ' <span class="bg">' + esc(d[5]) + '</span>' : '') + '</div>' : ''))
      .join('') + '</div>';
  }
  return head + chips + body;
}

/* -- Cadence --------------------------------------
   컨택을 조직·인물로 집계하고 목표 주기를 넘긴 곳을 표시한다.
   고유 리듬은 추정하지 않는다 - 목표는 주 단위로 직접 정한다.       */
const DAY = 86400000;
const dnum = s => { const p = String(s||'').split('-');
  return p.length===3 ? Date.UTC(+p[0], +p[1]-1, +p[2]) : 0; };
const daysAgo = s => { const t = dnum(s); if(!t) return null;
  const n = new Date();
  return Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()) - t)/DAY); };
const defWk = () => (CAD.__default && CAD.__default.target_wk) || DEF_WK;
const cadOf = c => CAD[cadKey(c)] || {};
const targetWk = c => { const o = cadOf(c); return o.target_wk || defWk(); };

function cadAgg(){
  const m = {};
  const put = c => m[c] || (m[c] = {company:c, last:'', n:0, w:0,
                                    kinds:{}, people:{}, zone:'', hist:[]});
  for(const l of LOGS){
    const c = l.company || l.title; if(!c) continue;
    const o = put(c);
    const k = l.kind || 'meet';
    const w = (l.weight != null) ? l.weight : (KW[k] || 1);
    o.n++; o.w += w; o.kinds[k] = (o.kinds[k]||0) + 1;
    if(l.zone && !o.zone) o.zone = l.zone;
    if(!o.last || l.date > o.last) o.last = l.date;
    if(o.hist.length < 8) o.hist.push({d:l.date, k:k,
        p:(l.people||[]).join(', '), place:l.place||''});
    for(const nmp of (l.people||[])){
      const q = o.people[nmp] || (o.people[nmp] = {name:nmp, last:'', n:0});
      q.n++; if(!q.last || l.date > q.last) q.last = l.date;
    }
  }
  for(const k in CAD){ if(k !== '__default' && CAD[k].company) put(CAD[k].company); }
  const rows = Object.values(m).map(o => {
    const wk = targetWk(o.company), lim = wk * 7;
    const d = o.last ? daysAgo(o.last) : null;
    const st = d == null ? 'none' : (d > lim ? 'l' : (d > lim*0.8 ? 's' : 'o'));
    return Object.assign({}, o, {wk:wk, lim:lim, days:d, st:st,
      over:(d == null ? 9999 : d - lim), t1:(cadOf(o.company).tier === 'T1')});
  });
  rows.sort((a,b) => (b.t1 - a.t1) || (b.over - a.over));
  return rows;
}

const BGL = {l:'컨택 필요', s:'임박', o:'정상', none:'미컨택'};

function cadRow(r){
  const ratio = r.days == null ? null : r.days / r.lim;
  const o = inten(ratio, CAD_MAX);
  const pct = r.days == null ? 100 : Math.min(100, Math.round(r.days / r.lim * 100));
  const kinds = Object.keys(r.kinds).map(k => KLBL[k] + ' ' + r.kinds[k]).join(' · ');
  const np = Object.keys(r.people).length;
  const open = cadOpen === r.company;
  const over = (r.days != null && r.days > r.lim) ? (r.days - r.lim) : 0;
  let h = '<div class="cdr' + (open ? ' op' : '') + '" data-cad="' + esc(r.company) + '">' +
    '<div class="cdr1">' + swatch(o) +
      (r.t1 ? '<span class="t1">T-1</span>' : '') +
      '<b>' + esc(r.company) + '</b>' +
      '<span class="cdm">' + (r.days == null ? '기록 없음' : r.days + '일 전') + '</span></div>' +
    '<div class="cdr2">목표 ' + r.wk + '주' + (over ? ' · ' + over + '일 초과' : '') +
      (kinds ? ' · ' + kinds : '') + (np ? ' · 인물 ' + np + '명' : '') + '</div>' +
    '<div class="pb"><i style="width:' + pct + '%;opacity:' + (o || .3) + '"></i></div>';
  if(open){
    h += '<div class="cdx">';
    const ps = Object.values(r.people).sort((a,b) => dnum(b.last) - dnum(a.last));
    if(ps.length){
      h += '<div class="cdsec">인물 <em>' + ps.length + '명</em></div>';
      for(const p of ps){
        const pd = daysAgo(p.last);
        h += '<div class="pp">' + swatch(pd == null ? null : inten(pd / r.lim, CAD_MAX)) +
             '<b>' + esc(p.name) + '</b>' +
             '<span class="cdm">' + (pd == null ? '-' : pd + '일') +
             ' · 컨택 ' + p.n + '</span></div>';
      }
    }
    if(r.hist.length){
      h += '<div class="cdsec">이력</div>';
      for(const e of r.hist)
        h += '<div class="hz">' + esc(e.d) + ' · ' + (KLBL[e.k] || e.k) +
             (e.place ? ' · ' + esc(e.place) : '') + (e.p ? ' · ' + esc(e.p) : '') + '</div>';
    }
    h += '<div style="margin-top:8px">' +
      '<button class="chip on" data-cq="' + esc(r.company) + '">컨택 담기</button> ' +
      '<button class="chip" data-cs="' + esc(r.company) + '">팔로업 설정</button></div></div>';
  }
  return h + '</div>';
}

let cadFilt = 'over';
function paneCad(){
  let rows = cadAgg();
  if(cadFilt === 't1')   rows = rows.filter(r => r.t1);
  if(cadFilt === 'none') rows = rows.filter(r => r.st === 'none');
  if(cadFilt === 'recent') rows = rows.slice().sort((a,b) => dnum(b.last) - dnum(a.last));
  const need = rows.filter(r => r.st === 'l').length;
  const CH = [['over','경과순'],['recent','최근순'],['t1','T-1만'],['none','미컨택']];
  let h = '<div class="chips" style="margin-bottom:9px">' +
    CH.map(c => '<div class="chip' + (cadFilt === c[0] ? ' on' : '') +
      '" data-cf="' + c[0] + '">' + c[1] + '</div>').join('') + '</div>' +
    '<div class="cnt" style="margin:0 0 8px">컨택 필요 <b>' + need + '</b>곳 · 전체 ' +
      rows.length + '곳 · 기본 주기 ' + defWk() + '주' +
      '<span class="swlg">경과 <i style="opacity:.3"></i><i style="opacity:.48"></i><i style="opacity:.65"></i><i style="opacity:.83"></i><i style="opacity:1"></i> 초과</span></div>';
  if(!rows.length)
    h += '<div class="empty">아직 기록이 없습니다. Field Notes에서 컨택을 담으세요.</div>';
  const t1 = rows.filter(r => r.t1), rest = rows.filter(r => !r.t1);
  if(t1.length) h += '<div class="cdsec">T-1 <em>지정 ' + t1.length + '곳</em></div>' +
    t1.map(cadRow).join('');
  if(rest.length) h += '<div class="cdsec">기본 <em>목표 ' + defWk() + '주</em></div>' +
    rest.map(cadRow).join('');
  h += '<div style="margin-top:14px"><button class="chip" data-cs="__default">' +
       '기본 주기 변경</button></div>';
  return h;
}

const WKS = [2,4,6,8,12,26];
function sheetCad(){
  if(!cadSheet) return '';
  const isDef = cadSheet === '__default';
  const o = isDef ? {target_wk:defWk()} : cadOf(cadSheet);
  const wk = o.target_wk || defWk();
  return '<div class="shbg" data-shx="1"></div><div class="sheet">' +
    '<div class="shh">' + (isDef ? '기본 주기' : esc(cadSheet)) + '</div>' +
    (isDef ? '' : '<div class="fr"><label>티어</label><div class="seg" id="cd-tier">' +
      '<div data-tier="T1" class="' + (o.tier === 'T1' ? 'on' : '') + '">T-1 핵심</div>' +
      '<div data-tier="" class="' + (o.tier === 'T1' ? '' : 'on') + '">기본</div></div></div>') +
    '<div class="fr"><label>목표 주기</label><div class="chips">' +
      WKS.map(w => '<div class="chip' + (w === wk ? ' on' : '') +
        '" data-wk="' + w + '">' + w + '주</div>').join('') + '</div></div>' +
    (isDef ? '' : '<div class="fr"><label>메모</label>' +
      '<input id="cd-memo" placeholder="선택" value="' + esc(o.memo || '') + '"></div>') +
    '<div style="display:flex;gap:6px;margin-top:11px">' +
      '<button class="btn p" id="cd-save">저장</button>' +
      '<button class="btn" data-shx="1">닫기</button></div></div>';
}

/* ── 렌더 ─────────────────────────────────────── */
function render(){
  const scan = (TAB==='scan'||TAB==='watch');
  $('scanctl').style.display = scan?'':'none';
  $('cnt').style.display = scan?'':'none';
  $('list').style.display = scan?'':'none';
  $('more').style.display = (scan&&shown<view.length)?'':'none';
  $('panes').innerHTML = '';
  if(scan){ if(DATA) rebuild(); return; }
  // 폼은 로그인 없이도 보인다. 막는 건 담을 때뿐이다.
  $('panes').innerHTML =
    (USER?'':'<div class="note" style="background:none;border:1px solid var(--bd);'+
      'border-radius:9px;padding:9px 11px;font-size:11px;color:var(--mut);margin-bottom:11px">'+
      '로그인하지 않았습니다 — 폼은 볼 수 있지만 담기는 되지 않습니다.</div>')+
    (TAB==='idea'?paneIdea():(TAB==='cad'?paneCad():(TAB==='deal'?paneDeal():paneField()))) + sheetCad();
  if(TAB==='field'){
    const f=$('fn-f'); if(f) f.onchange=e=>{ fnFile=e.target.files[0]||null; render(); };
  }
}

function kpi(){
  if(!DATA) return;
  const n={new:0,watch:0,seen:0,drop:0};
  for(const r of DATA.companies) n[stOf(r.c)]++;
  $('kpi').innerHTML =
    '<div><b>'+DATA.companies.length.toLocaleString()+'</b><i>전체</i></div>'+
    '<div><b>'+n.new.toLocaleString()+'</b><i>미검토</i></div>'+
    '<div><b>'+n.watch+'</b><i>관심</i></div>'+
    '<div><b>'+n.seen+'</b><i>검토</i></div>'+
    '<div><b>'+n.drop+'</b><i>제외</i></div>';
}

/* ── 이벤트 ───────────────────────────────────── */
document.addEventListener('click', async e => {
  const tb=e.target.closest('.tb');
  if(tb){ document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x===tb));
    TAB=tb.dataset.t; render(); window.scrollTo(0,0); return; }

  const ab=e.target.closest('.ab[data-st]');
  if(ab){ if(!USER) return needLogin();
    const c=ab.dataset.c,k=ab.dataset.st;
    STATE[c]=STATE[c]||{}; STATE[c].st=(STATE[c].st===k)?'new':k; saveState();
    const box=ab.closest('details');
    box.querySelectorAll('.ab[data-st]').forEach(x=>x.classList.toggle('on',x.dataset.st===STATE[c].st));
    const s=box.querySelector('.st'); s.className='st st-'+stOf(c); s.textContent=SLBL[stOf(c)];
    kpi(); return; }

  const ie=e.target.closest('.ab[data-idea]');
  if(ie){ const r=DATA.companies.find(x=>x.c===ie.dataset.idea);
    ideaPrefill=r?r.n:''; TAB='idea';
    document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x.dataset.t==='idea'));
    render(); if($('id-t')) $('id-t').value=ideaPrefill; window.scrollTo(0,0); return; }

  const ch=e.target.closest('.chip');
  if(ch){ const g=ch.parentElement;
    g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===ch));
    if(g.id==='sorts') SORT=ch.dataset.v; else FILT=ch.dataset.v;
    rebuild(); return; }

  if(e.target.id==='id-go'){
    if(!USER) return needLogin();
    const t=comboVal('id-t'), a=$('id-a').value.trim(), d=$('id-d').value;
    if(!t||!a||!d){ $('id-msg').textContent='대상·아이디어·due 는 필수입니다'; return; }
    $('id-go').disabled=true; $('id-msg').textContent='담는 중…';
    try{ await enqueue('idea',{target:t,title:t,angle:a,stage:$('id-s').value,due:d});
      $('id-a').value=''; $('id-msg').textContent='담았습니다'; }
    catch(x){ $('id-msg').textContent='실패 — '+x.message; }
    $('id-go').disabled=false; return;
  }

  const seg=e.target.closest('#fn-seg div');
  if(seg){ fnMode=seg.dataset.m; render(); return; }

  if(e.target.id==='fn-go' || e.target.id==='fn-brief' || e.target.id==='fn-full'){
    if(!USER) return needLogin();
    const briefOnly = e.target.id==='fn-brief';
    const full = e.target.id==='fn-full';
    const c=comboVal('fn-c'), txt=$('fn-t').value.trim();
    if(!c){ $('fn-msg').textContent='상대를 고르세요'; return; }
    if(briefOnly && !txt){ $('fn-msg').textContent='보고 초안은 적은 내용이 있어야 합니다'; return; }
    if(!briefOnly){
      // '둘 다'는 둘 다 강요하는 게 아니라 둘 다 받을 수 있다는 뜻이다.
      // 녹음만 있어도, 메모만 있어도 넘어간다.
      if(fnMode==='txt' && !txt){ $('fn-msg').textContent='내용을 적어주세요'; return; }
      if(fnMode==='rec' && !fnFile){ $('fn-msg').textContent='녹음 파일을 고르세요'; return; }
      if(fnMode==='both' && !txt && !fnFile){
        $('fn-msg').textContent='녹음이나 메모 중 하나는 있어야 합니다'; return; }
    }
    e.target.disabled=true; $('fn-msg').textContent='담는 중…';
    try{
      const place=$('fn-l').value.trim();
      const xy=resolveXY(place, $('fn-z').value, c);
      const att=$('fn-p')?$('fn-p').value.trim():'';
      // 인물 칩이 비어 있으면 참석 칸을 쉼표로 갈라 쓴다 — 추적이 새지 않게
      const ppl = fnPeople.length ? fnPeople.slice()
        : att.split(',').map(x=>x.trim()).filter(Boolean);
      const rec={company:c,title:c,date:$('fn-d').value,zone:$('fn-z').value,
                 attendees:att,note:txt,mode:fnMode,
                 people:ppl, kind:'meet', weight:1,
                 place, x:xy[0], y:xy[1], src:xy[2]};
      if(briefOnly){
        await enqueue('brief', rec);
        $('fn-msg').textContent='보고 초안을 요청했습니다';
      }else{
        let audio='';
        if(fnFile){
          $('fn-msg').textContent='업로드 중…';
          const path='users/'+USER.uid+'/field_notes/'+Date.now()+'_'+fnFile.name;
          await uploadBytes(sref(storage,path),fnFile);
          audio=path;
        }
        await enqueue(full?'full':'field',{...rec,audio});
        await addDoc(collection(db,'users',USER.uid,'field_notes'),
                     {...rec,audio,at:serverTimestamp()});
        fnFile=null;
        $('fn-msg').textContent = full
          ? '담았습니다 — 노트·국문·영문까지 만듭니다'
          : '담았습니다';
        render();
      }
    }catch(x){ $('fn-msg').textContent='실패 — '+x.message; }
    for(const id of ['fn-go','fn-brief','fn-full']) if($(id)) $(id).disabled=false;
    return;
  }

  const en=e.target.closest('[data-en]');
  if(en){
    if(!USER) return needLogin();
    const q=QUEUE.find(x=>x.id===en.dataset.en);
    if(!q||!q.output) return;
    en.disabled=true; en.textContent='담는 중…';
    try{ await enqueue('word',{text:q.output,tone:'formal',
           context:'internal report after client meeting',
           recipient:'colleagues', parent:q.id,
           title:(q.company||'')+' 영문'});
      en.textContent='요청함'; }
    catch(x){ en.textContent='실패 — '+x.message; en.disabled=false; }
    return;
  }

  const cp=e.target.closest('[data-copy]');
  if(cp){
    const [id,which]=cp.dataset.copy.split(':');
    const q=QUEUE.find(x=>x.id===id);
    const txt=q && (which==='en' ? q.output_en : q.output);
    if(txt){ navigator.clipboard.writeText(txt);
      const t=cp.textContent; cp.textContent='복사됨';
      setTimeout(()=>cp.textContent=t,1500); } }
});

document.addEventListener('input', e => {
  if(e.target.matches('.memo')){
    if(!USER) return;
    const c=e.target.dataset.memo;
    STATE[c]=STATE[c]||{}; STATE[c].memo=e.target.value;
    clearTimeout(window._ms); window._ms=setTimeout(saveState,600);
  }
});
$('q').addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(rebuild,180);});
$('more').addEventListener('click',page);

/* ── 부트 ─────────────────────────────────────── */
Promise.all([
  fetch('data.json?v='+BUILD).then(r=>r.json()),
  fetch('entities.json?v='+BUILD).then(r=>r.json()).catch(()=>null),
  fetch('seoul.json?v='+BUILD).then(r=>r.json()).catch(()=>null),
  fetch('geo.json?v='+BUILD).then(r=>r.json()).catch(()=>null),
]).then(([d,ent,map,geo])=>{
  DATA=d; ENT=ent; MAP=map; GEO=geo;
  $('hd').textContent = d.generated.slice(0,16).replace('T',' ')+' · '+
    d.companies.length.toLocaleString()+'사 · vault '+Object.keys(d.vault).length+'사'+
    (ent?' · 상대 '+ent.items.length.toLocaleString()+'곳':'');
  $('sorts').innerHTML = SORTS.map((s,i)=>'<div class="chip'+(i===0?' on':'')+
    '" data-v="'+s[0]+'">'+s[1]+'</div>').join('');
  $('filts').innerHTML = FILTS.map((f,i)=>'<div class="chip'+(i===0?' on':'')+
    '" data-v="'+f[0]+'">'+f[1]+'</div>').join('');
  $('ft').innerHTML = 'build '+BUILD+' · 상태·큐는 Firestore 동기화<br>'+
    '지표·공시는 DART 원문에서 규칙으로 산출한 값입니다. 판정이 아니라 판단 재료입니다.';
  kpi(); render();
}).catch(e=>{
  $('list').innerHTML='<div class="empty">데이터를 불러오지 못했습니다<br>'+esc(e.message)+'</div>';
});

// 새 서비스워커가 들어오면 한 번만 새로고침한다. 배포해도 옛 화면이 남는 걸 막는다.
if('serviceWorker' in navigator){
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloaded) return; reloaded=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js')
      .then(r=>{ r.update(); setInterval(()=>r.update(), 60*60*1000); })
      .catch(()=>{});
  });
}
